    const evScore = e => e.today ? [state.gd.us, state.gd.them] : e.score;
    const resultText = s => (s[0] > s[1] ? 'W' : s[0] < s[1] ? 'L' : 'D') + ' ' + s[0] + '–' + s[1];
    const phaseLabel = () => ({ pre: 'Pre-match', live1: '1st half', ht: 'Half time', live2: '2nd half', ft: 'Full time' }[state.gd.phase]);
    const clockState = () => state.gd.phase === 'ft' ? 'Final' : state.gd.phase === 'ht' ? 'Start 2nd half' : state.gd.running ? 'Running' : 'Paused';

    /* ---------- fair play ---------- */
    function fair() {
      const g = state.gd;
      const avail = ROSTERS.stars.filter(p => !p.out);
      const n = Math.max(avail.length, 1);
      const target = (HALF * 2 * ON_FIELD) / n;
      const now = (g.sec * ON_FIELD) / n;
      const slotOf = id => g.slots.find(s => s.pid === id);
      const status = p => {
        if (p.out) return 'out';
        const slot = slotOf(p.id);
        const d = p.sec - now;
        if (slot) return slot.pos === 'GK' ? 'gk' : d > 420 ? 'rest' : 'ok';
        return d < -300 ? 'due' : 'ok';
      };
      const due = avail.filter(p => status(p) === 'due');
      const rest = avail.filter(p => status(p) === 'rest');
      let suggestion = null;
      if (!matchOver()) {
        const benchP = g.bench.map(starById).filter(Boolean).sort((a, b) => a.sec - b.sec)[0];
        const fieldIdx = g.slots.map((s, i) => ({ i: i, pos: s.pos, p: starById(s.pid) })).filter(x => x.pos !== 'GK').sort((a, b) => b.p.sec - a.p.sec)[0];
        if (benchP && fieldIdx && fieldIdx.p.sec - benchP.sec > 300) suggestion = { inId: benchP.id, slot: fieldIdx.i };
      }
      return { target: target, status: status, due: due, rest: rest, n: n, suggestion: suggestion, slotOf: slotOf };
    }
    const STATUS = {
      due: { cls: 'is-due', icon: 'alert', text: 'Due on' },
      rest: { cls: 'is-rest', icon: 'alert', text: 'Due a rest' },
      ok: { cls: 'is-ok', icon: 'check', text: 'On track' },
      gk: { cls: '', icon: 'check', text: 'Keeper' },
      out: { cls: 'is-out', icon: 'ban', text: 'Out' }
    };
    const statusLine = st => '<span class="pstatus ' + STATUS[st].cls + '">' + icon(STATUS[st].icon, 'icon-sm') + STATUS[st].text + '</span>';

    /* ---------- shared fragments ---------- */
    function teamRail() {
      return '<div class="od-rail" role="group" aria-label="Choose team">' + TEAMS.map(t =>
        '<button class="team-chip od-field" data-action="team" data-id="' + t.id + '" aria-pressed="' + (t.id === state.team) + '">' +
          '<span class="team-chip-name">' + esc(t.name) + '</span>' +
          '<span class="team-chip-meta">' + esc(teamMeta(t)) + '</span>' +
        '</button>').join('') + '</div>';
    }

    function eventRow(e, o) {
      o = o || {};
      const live = isLive(e), past = isPast(e);
      const teamBit = o.team ? ' · ' + esc(teamById(e.team).name) : '';
      const tag = live
        ? '<span class="ev-tag is-live"><span class="live-dot"></span>Live now' + teamBit + '</span>'
        : '<span class="ev-tag is-' + e.type + '">' + icon(e.type === 'match' ? 'ball' : 'cone', 'icon-sm') + (e.type === 'match' ? 'Match' : 'Practice') + teamBit + '</span>';
      let meta;
      const sc = evScore(e);
      if (live) meta = phaseLabel() + ' · ' + state.gd.us + '–' + state.gd.them + ' · ' + e.venue;
      else if (past && e.type === 'match') meta = sc ? 'Final · ' + resultText(sc) : 'Played · ' + fmtTime(e.time);
      else if (past) meta = 'Done · ' + fmtTime(e.time);
      else meta = fmtTime(e.time) + ' · ' + (e.venue || 'Location not set');
      const d = toDate(e.date);
      const cell = o.date ? '<span class="datecell od-cell od-fixed"><span class="dc-mo">' + MO[d.getMonth()] + '</span><span class="dc-d">' + d.getDate() + '</span></span>' : '';
      return '<li><button class="event-row od-row" data-action="event" data-id="' + e.id + '">' + cell +
        '<span class="od-field od-fill">' + tag + '<span class="ev-title od-clamp-2">' + esc(evTitle(e)) + '</span><span class="ev-meta od-truncate">' + esc(meta) + '</span></span>' +
        icon('chev-right', 'chev') + '</button></li>';
    }

    function weekStrip(week, o) {
      let html = '<div class="week" role="group" aria-label="Days of the week">';
      for (let i = 0; i < 7; i++) {
        const iso = addDays(week, i);
        const d = toDate(iso);
        const evs = EVENTS.filter(e => e.date === iso && (o.team === 'all' || e.team === o.team) && (!o.type || o.type === 'all' || e.type === o.type));
        const types = ['match', 'practice'].filter(t => evs.some(e => e.type === t));
        const marks = types.map(t => '<span class="is-' + t + '">' + icon(t === 'match' ? 'ball' : 'cone', 'icon-sm') + '</span>').join('');
        const label = WDL[d.getDay()] + ', ' + fmtShort(iso) + (iso === TODAY ? ', today' : '') + ', ' + (evs.length ? types.map(t => t === 'match' ? 'match' : 'practice').join(' and ') : 'nothing scheduled');
        html += '<button class="day od-cell' + (iso === TODAY ? ' is-today' : '') + '" data-action="' + o.action + '" data-id="' + iso + '"' +
          (o.selectable ? ' aria-pressed="' + (o.selected === iso) + '"' : '') + ' aria-label="' + esc(label) + '">' +
          '<span class="day-wd">' + WD[d.getDay()] + '</span><span class="day-num">' + d.getDate() + '</span><span class="day-marks">' + marks + '</span></button>';
      }
      return html + '</div>';
    }

    const emptyState = (ic, title, text, actions) =>
      '<div class="empty"><h2>' + title + '</h2><p class="muted">' + text + '</p>' +
      (actions ? '<div class="od-cluster empty-actions">' + actions + '</div>' : '') + '</div>';

    /* ---------- Home ---------- */
    function renderHome() {
      const t = curTeam();
      const d = toDate(TODAY);
      $('#bar-home').innerHTML =
        '<div class="od-row-top"><div class="od-field od-fill"><p class="screen-kicker">' + WDL[d.getDay()] + ', ' + fmtShort(TODAY) + '</p><h1>Good morning, Rickey</h1></div>' +
        '<button class="icon-btn is-outlined od-fixed" data-action="appearance" aria-label="Appearance">' + icon('contrast') + '</button></div>';

      const evs = EVENTS.filter(e => e.team === t.id).sort(evSort);
      const live = evs.find(isLive);
      const upcoming = evs.filter(e => !isPast(e) && !isLive(e));
      const past = evs.filter(isPast).reverse();
      let hero, coming;
      if (live) {
        const f = fair();
        const hint = f.due.length ? plural(f.due.length, 'player', 'players') + ' due on' : 'Minutes even';
        hero =
          '<section class="hero on-navy' + (state.gd.running ? ' is-running' : '') + '" aria-label="Live match">' +
            '<div class="od-row"><span class="live-pill od-fill"><span class="live-dot"></span><span>Live · <span data-phase>' + phaseLabel() + '</span></span></span>' +
            '<span class="hero-clock od-nowrap od-fixed" data-clock>' + fmtClock(state.gd.sec) + '</span></div>' +
            '<div class="od-row hero-score"><span class="hero-team od-fill">' + esc(t.name) + '</span>' +
            '<span class="hero-num od-nowrap od-fixed">' + state.gd.us + '–' + state.gd.them + '</span>' +
            '<span class="hero-team is-right od-fill">' + esc(live.opp) + '</span></div>' +
            '<p class="hero-meta">' + esc(live.venue) + ' · ' + hint + '</p>' +
            '<a class="btn btn-volt btn-block" href="#/gameday">Open gameday</a>' +
          '</section>';
        coming = upcoming;
      } else if (upcoming.length) {
        const e = upcoming[0];
        hero =
          '<section class="hero on-navy" aria-label="Next up">' +
            '<p class="hero-label">' + (isPre(e) ? 'Kickoff in 15 min' : 'Next up') + ' · ' + (e.type === 'match' ? 'Match' : 'Practice') + '</p>' +
            '<h2 class="hero-title">' + esc(evTitle(e)) + '</h2>' +
            '<div class="od-field"><p class="od-nowrap">' + fmtDay(e.date) + ' · ' + fmtTime(e.time) + '</p><p class="hero-meta">' + esc(e.venue || 'Location not set') + '</p></div>' +
            (isPre(e)
              ? '<p class="hero-meta">' + filledCount() + ' of ' + state.gd.slots.length + ' positions filled</p><a class="btn btn-on-navy btn-block" href="#/gameday">' + (filledCount() === state.gd.slots.length ? 'Review lineup' : 'Set lineup') + '</a>'
              : '<button class="btn btn-on-navy btn-block" data-action="event" data-id="' + e.id + '">View details</button>') +
          '</section>';
        coming = upcoming.slice(1);
      } else {
        hero = emptyState('calendar', 'Nothing scheduled', 'No matches or practices for ' + esc(t.name) + ' yet.',
          '<button class="btn btn-primary" data-action="add-event">' + icon('plus') + 'Add event</button>');
        coming = [];
      }

      let html = teamRail() + hero +
        '<section class="section"><div class="od-row section-head"><h2 class="od-fill">This week</h2><a class="link od-fixed" href="#/calendar">Open calendar</a></div>' +
        weekStrip(weekStart(TODAY), { action: 'home-day', team: t.id }) + '</section>';
      if (coming.length) html += '<section class="section"><h2>Coming up</h2><ul class="event-list">' + coming.slice(0, 3).map(e => eventRow(e, { date: true })).join('') + '</ul></section>';
      if (past.length) html += '<section class="section"><h2>Recent</h2><ul class="event-list">' + past.slice(0, 3).map(e => eventRow(e, { date: true })).join('') + '</ul></section>';
      $('#body-home').innerHTML = html;
    }

    /* ---------- Calendar ---------- */
    function renderCalendar() {
      const c = state.cal;
      const end = addDays(c.week, 6);
      const thisWeek = c.week === weekStart(TODAY);
      $('#bar-calendar').innerHTML =
        '<div class="od-row"><h1 class="od-fill">Calendar</h1><button class="btn btn-primary btn-sm od-fixed" data-action="add-event">' + icon('plus') + 'Add event</button></div>' +
        '<div class="od-row"><button class="icon-btn is-outlined od-fixed" data-action="cal-prev" aria-label="Previous week">' + icon('chev-left') + '</button>' +
        '<p class="week-nav-label od-fill od-nowrap">' + fmtShort(c.week) + ' – ' + fmtShort(end) + (thisWeek ? ' · This week' : '') + '</p>' +
        '<button class="icon-btn is-outlined od-fixed" data-action="cal-next" aria-label="Next week">' + icon('chev-right') + '</button></div>' +
        weekStrip(c.week, { action: 'cal-day', selectable: true, selected: c.day, team: c.team, type: c.type });

      const chips = '<div class="od-rail" role="group" aria-label="Filter by team">' +
        [{ id: 'all', name: 'All teams' }].concat(TEAMS).map(t => '<button class="chip" data-action="cal-team" data-id="' + t.id + '" aria-pressed="' + (c.team === t.id) + '">' + esc(t.name) + '</button>').join('') + '</div>';
      const seg = '<div class="seg" role="group" aria-label="Filter by event type">' +
        [['all', 'All'], ['match', 'Matches'], ['practice', 'Practices']].map(x => '<button data-action="cal-type" data-v="' + x[0] + '" aria-pressed="' + (c.type === x[0]) + '">' + x[1] + '</button>').join('') + '</div>';

      const days = c.day ? [c.day] : [0, 1, 2, 3, 4, 5, 6].map(i => addDays(c.week, i));
      const match = e => (c.team === 'all' || e.team === c.team) && (c.type === 'all' || e.type === c.type);
      let agenda = '';
      days.forEach(iso => {
        const evs = EVENTS.filter(e => e.date === iso && match(e)).sort(evSort);
        if (!evs.length) return;
        agenda += '<section class="section"><div class="od-row"><h2 class="day-head od-fill">' + fmtDay(iso) + '</h2>' + (iso === TODAY ? '<span class="day-head-today od-fixed">Today</span>' : '') + '</div>' +
          '<ul class="event-list">' + evs.map(e => eventRow(e, { team: c.team === 'all' })).join('') + '</ul></section>';
      });
      const filtered = c.team !== 'all' || c.type !== 'all';
      if (!agenda) {
        agenda = emptyState('calendar',
          c.day ? 'Nothing on ' + fmtDay(c.day) : 'Nothing this week',
          filtered ? 'No events match these filters.' : 'No matches or practices.',
          '<button class="btn btn-primary" data-action="add-event">' + icon('plus') + 'Add event</button>' +
          (filtered ? '<button class="btn btn-secondary" data-action="cal-clear">Clear filters</button>' : ''));
      }
      const back = (c.day ? '<button class="btn btn-secondary btn-sm" data-action="cal-week">Show whole week</button>' : '') +
        (!thisWeek ? '<button class="btn btn-secondary btn-sm" data-action="cal-today">Back to this week</button>' : '');
      $('#body-calendar').innerHTML = chips + seg + (back ? '<div class="od-cluster">' + back + '</div>' : '') + agenda;
    }

    /* ---------- Gameday ---------- */
    function playerRow(p, f, kind, slotIdx) {
      const st = f.status(p);
      const slot = f.slotOf(p.id);
      const pos = slot ? slot.pos : p.pos;
      const frac = Math.min(1, p.sec / f.target).toFixed(3);
      const over = matchOver();
      const action = kind === 'bench'
        ? '<button class="btn btn-secondary btn-sm od-fixed" data-action="sub-in" data-id="' + p.id + '"' + (over ? ' disabled' : '') + '>Sub in</button>'
        : '<button class="icon-btn is-outlined od-fixed" data-action="sub-out" data-slot="' + slotIdx + '" aria-label="Sub off ' + esc(p.name) + '"' + (over ? ' disabled' : '') + '>' + icon('swap') + '</button>';
      return '<li class="prow od-row"><span class="prow-num od-fixed">' + p.n + '</span>' +
        '<div class="od-field od-fill prow-body">' +
          '<div class="od-row"><span class="prow-name od-truncate od-fill">' + esc(p.name) + ' <span class="prow-pos">' + pos + '</span></span><span class="prow-min od-nowrap od-fixed">' + mins(p.sec) + ' min</span></div>' +
          '<span class="bar ' + STATUS[st].cls + '" aria-hidden="true"><span class="bar-fill" style="transform:scaleX(' + frac + ')"></span></span>' +
          (p.sec === 0 && kind === 'bench' ? '<span class="pstatus is-due">' + icon('alert', 'icon-sm') + 'Has not played yet</span>' : statusLine(st)) +
        '</div>' + action + '</li>';
    }

    function renderGameday() {
      const t = curTeam();
      const bar = $('#bar-gameday');
      const body = $('#body-gameday');
      const foot = $('#foot-gameday');
      foot.hidden = true;
      foot.innerHTML = '';
      if (t.id !== 'stars') {
        bar.className = 'screen-bar';
        bar.innerHTML = '<div class="od-field"><p class="screen-kicker">' + esc(t.name) + '</p><h1>Gameday</h1></div>';
        body.innerHTML = emptyState('ball', 'No match today', 'Gameday opens on match days.',
          '<button class="btn btn-primary" data-action="team" data-id="stars">Switch to Shooting Stars</button><a class="btn btn-secondary" href="#/calendar">Open calendar</a>');
        return;
      }
      const g = state.gd;
      if (state.gd.phase === 'pre') { renderLineup(t, bar, body, foot); return; }
      const ev = EVENTS.find(e => e.today);
      const over = matchOver();
      const f = fair();
      bar.className = 'on-navy';
      bar.innerHTML =
        '<div class="scorebar' + (g.running ? ' is-running' : '') + '">' +
          '<div class="od-row"><span class="live-pill od-fill"><span class="live-dot"></span><span data-phase>' + phaseLabel() + '</span></span><span class="sb-meta od-fixed od-nowrap">U9G · ' + esc(ev.venue) + '</span></div>' +
          '<div class="sb-grid">' +
            '<div class="od-stat sb-team"><span class="sb-name">' + esc(t.name) + '</span><span class="sb-score">' + g.us + '</span>' +
              '<button class="btn btn-navy-raised goal-btn" data-action="goal-us"' + (over ? ' disabled' : '') + ' aria-label="Add goal for ' + esc(t.name) + '">' + icon('plus', 'icon-sm') + 'Goal</button></div>' +
            '<div class="sb-clock"><span class="clock" data-clock role="timer" aria-label="Match clock">' + fmtClock(g.sec) + '</span>' +
              '<button class="clock-btn" data-action="clock-toggle"' + (over ? ' disabled' : '') + ' aria-label="' + (g.running ? 'Pause clock' : g.phase === 'ht' ? 'Start second half' : 'Start clock') + '">' + icon(g.running ? 'pause' : 'play') + '</button>' +
              '<span class="clock-state">' + clockState() + '</span></div>' +
            '<div class="od-stat sb-team is-right"><span class="sb-name">' + esc(ev.opp) + '</span><span class="sb-score">' + g.them + '</span>' +
              '<button class="btn btn-navy-raised goal-btn" data-action="goal-them"' + (over ? ' disabled' : '') + ' aria-label="Add goal for ' + esc(ev.opp) + '">' + icon('plus', 'icon-sm') + 'Goal</button></div>' +
          '</div>' +
        '</div>';

      let advice;
      if (over) advice = '<p class="balanced">' + icon('check-circle', 'icon-sm') + 'Full time.</p>';
      else if (f.suggestion) {
        const pin = starById(f.suggestion.inId), pout = starById(g.slots[f.suggestion.slot].pid);
        advice = '<div class="suggest od-row"><div class="od-field od-fill"><span class="suggest-label">Suggested sub</span><span class="suggest-text">' + esc(pin.name) + ' on for ' + esc(pout.name) + '</span></div>' +
          '<button class="btn btn-primary od-fixed" data-action="suggest-swap">Make sub</button></div>';
      } else advice = '<p class="balanced">' + icon('check-circle', 'icon-sm') + 'Minutes are even. No sub needed.</p>';

      const fairCard =
        '<section class="card fair" aria-label="Fair play">' +
          '<div class="od-row-top">' +
          '<div class="od-field od-fill"><h2>Fair play</h2><p class="small muted">Target about ' + Math.round(f.target / 60) + ' min each · ' + plural(f.n, 'player', 'players') + ' today</p>' +
          '<p class="small"><strong>' + f.due.length + '</strong> due on · <strong>' + f.rest.length + '</strong> due a rest</p></div></div>' + advice +
        '</section>';

      const seg = '<div class="seg seg-compact od-fixed" role="group" aria-label="Lineup view">' +
        [['pitch', 'Pitch'], ['list', 'List']].map(x => '<button data-action="gd-view" data-v="' + x[0] + '" aria-pressed="' + (g.view === x[0]) + '">' + x[1] + '</button>').join('') + '</div>';

      let lineup;
      if (g.view === 'pitch') {
        const token = i => {
          const p = starById(g.slots[i].pid), st = f.status(p);
          return '<button class="token od-cell' + (st === 'rest' ? ' is-rest' : '') + '" data-action="sub-out" data-slot="' + i + '"' + (over ? ' disabled' : '') +
            ' aria-label="' + esc(p.name) + ', ' + POS[g.slots[i].pos].toLowerCase() + ', ' + mins(p.sec) + ' minutes, ' + STATUS[st].text.toLowerCase() + '. Sub off">' +
            '<span class="token-num">' + p.n + '</span><span class="token-name od-truncate">' + esc(firstName(p)) + '</span>' +
            '<span class="token-min od-nowrap">' + (st === 'rest' ? 'Rest · ' : '') + mins(p.sec) + ' min</span></button>';
        };
        lineup = '<div class="pitch"><span class="pitch-lines" aria-hidden="true"></span><span class="pitch-arc" aria-hidden="true"></span><span class="pitch-box" aria-hidden="true"></span>' +
          pitchRows().map(r => '<div class="pitch-row">' + r.map(token).join('') + '</div>').join('') + '</div>' +
          '<p class="small muted">Tap a player to sub them off.</p>';
      } else {
        lineup = '<ul class="player-list">' + g.slots.map((s, i) => playerRow(starById(s.pid), f, 'field', i)).join('') + '</ul>';
      }

      const benchP = g.bench.map(starById).filter(Boolean).sort((a, b) => a.sec - b.sec);
      const bench = benchP.length
        ? '<ul class="player-list">' + benchP.map(p => playerRow(p, f, 'bench')).join('') + '</ul>'
        : '<p class="muted">Bench is empty.</p>';
      const outs = ROSTERS.stars.filter(p => p.out);

      body.innerHTML = fairCard +
        '<section class="section"><div class="od-row section-head"><h2 class="od-fill">On the field · ' + g.slots.length + '</h2>' + seg + '</div>' + lineup + '</section>' +
        '<section class="section"><div class="od-row section-head"><h2 class="od-fill">Bench · ' + benchP.length + '</h2></div>' + bench +
        (outs.length ? '<p class="small muted">Out today: ' + outs.map(p => esc(p.name)).join(', ') + '</p>' : '') + '</section>';
    }

    /* ---------- Gameday: pre-match lineup builder ---------- */
    const FORMATIONS = {
      '2-3-1': ['GK', 'DEF', 'DEF', 'MID', 'MID', 'MID', 'FWD'],
      '3-2-1': ['GK', 'DEF', 'DEF', 'DEF', 'MID', 'MID', 'FWD'],
      '2-2-2': ['GK', 'DEF', 'DEF', 'MID', 'MID', 'FWD', 'FWD']
    };
    function announce(msg) {
      const el = $('#srStatus');
      el.textContent = '';
      setTimeout(() => { el.textContent = msg; }, 30);
    }
    function placePlayer(pid, i) {
      const g = state.gd, j = slotIndexOf(pid), other = g.slots[i].pid, p = starById(pid);
      if (j === i) return;
      if (j >= 0) g.slots[j].pid = other;
      else { g.bench = g.bench.filter(x => x !== pid); if (other) g.bench.push(other); }
      g.slots[i].pid = pid;
      state.pick = null;
      announce(p.name + (other ? ' swapped with ' + starById(other).name : ' placed') + ' at ' + POS[g.slots[i].pos].toLowerCase() + '. ' + filledCount() + ' of ' + g.slots.length + ' positions filled.');
    }
    function benchPlayer(pid) {
      const g = state.gd, j = slotIndexOf(pid);
      if (j < 0) return;
      g.slots[j].pid = null;
      g.bench.push(pid);
      state.pick = null;
      announce(starById(pid).name + ' moved to the bench. ' + filledCount() + ' of ' + g.slots.length + ' positions filled.');
    }
    function setFormation(key) {
      const g = state.gd, pools = { GK: [], DEF: [], MID: [], FWD: [] };
      g.slots.forEach(x => { if (x.pid) pools[x.pos].push(x.pid); });
      g.formation = key;
      g.slots = FORMATIONS[key].map(pos => ({ pos: pos, pid: pools[pos].shift() || null }));
      const left = [].concat(pools.GK, pools.DEF, pools.MID, pools.FWD);
      g.slots.forEach(x => { if (!x.pid && left.length) x.pid = left.shift(); });
      state.pick = null;
    }
    function autoFill() {
      const g = state.gd;
      g.slots.forEach(x => {
        if (x.pid) return;
        const k = g.bench.findIndex(id => starById(id).pos === x.pos);
        if (k >= 0) x.pid = g.bench.splice(k, 1)[0];
      });
      g.slots.forEach(x => { if (!x.pid && g.bench.length) x.pid = g.bench.shift(); });
      state.pick = null;
    }
    function clearLineup() {
      const g = state.gd;
      g.slots.forEach(x => { if (x.pid) { g.bench.push(x.pid); x.pid = null; } });
      state.pick = null;
    }

    function renderLineup(t, bar, body, foot) {
      const g = state.gd, ev = EVENTS.find(e => e.today), n = g.slots.length, filled = filledCount();
      const picked = state.pick ? starById(state.pick) : null;
      bar.className = 'screen-bar';
      bar.innerHTML = '<div class="od-field"><p class="screen-kicker">' + esc(t.name) + ' vs ' + esc(ev.opp) + '</p><h1>Set your lineup</h1>' +
        '<p class="small muted">Kickoff ' + fmtTime(ev.time) + ' · in 15 min · ' + esc(ev.venue) + '</p></div>';

      const seg = '<div class="od-row section-head"><h2 class="od-fill">Formation</h2><div class="seg seg-compact od-fixed" role="group" aria-label="Formation">' +
        Object.keys(FORMATIONS).map(k => '<button data-action="gd-formation" data-v="' + k + '" aria-pressed="' + (g.formation === k) + '">' + k + '</button>').join('') + '</div></div>';

      const slot = i => {
        const x = g.slots[i], p = x.pid ? starById(x.pid) : null;
        if (!p) {
          return '<button class="slot od-cell is-empty" data-action="slot" data-slot="' + i + '" data-drop="slot:' + i + '" aria-label="' + POS[x.pos] + ' position, empty. ' +
            (picked ? 'Place ' + esc(picked.name) + ' here' : 'Choose a player') + '"><span class="slot-ring">' + icon('plus') + '</span><span class="token-name">Open</span><span class="token-min">' + x.pos + '</span></button>';
        }
        return '<button class="slot od-cell" data-action="slot" data-slot="' + i + '" data-drop="slot:' + i + '" data-drag="' + p.id + '" aria-pressed="' + (state.pick === p.id) + '" aria-label="' +
          POS[x.pos] + ': ' + esc(p.name) + ', number ' + num(p) + '"><span class="token-num">' + num(p) + '</span><span class="token-name od-truncate">' + esc(firstName(p)) + '</span><span class="token-min">' + x.pos + '</span></button>';
      };
      const pitch = '<div class="pitch"><span class="pitch-lines" aria-hidden="true"></span><span class="pitch-arc" aria-hidden="true"></span><span class="pitch-box" aria-hidden="true"></span>' +
        pitchRows().map(r => '<div class="pitch-row">' + r.map(slot).join('') + '</div>').join('') + '</div>';
      const hint = picked
        ? '<p class="small"><strong>' + esc(picked.name) + '</strong> selected. Tap a position, or tap again to cancel.</p>'
        : '<p class="small muted">Drag a player onto a position, or tap a player and then a position.</p>';

      const benchP = g.bench.map(starById).filter(Boolean);
      const chips = benchP.map(p => '<button class="bench-chip od-row" data-action="pick" data-id="' + p.id + '" data-drag="' + p.id + '" aria-pressed="' + (state.pick === p.id) + '" aria-label="' +
        esc(p.name) + ', ' + POS[p.pos].toLowerCase() + ', number ' + num(p) + '"><span class="bench-num od-fixed">' + num(p) + '</span><span class="od-field od-fill"><span class="bench-name od-truncate">' +
        esc(firstName(p)) + '</span><span class="bench-pos">' + p.pos + '</span></span></button>').join('');
      const tray = '<div class="bench-tray" data-drop="bench">' +
        (chips ? '<div class="od-grid" style="--od-gap:8px">' + chips + '</div>' : '<p class="small muted">Everyone is on the pitch. Drag a player here to bench them.</p>') +
        (picked && slotIndexOf(picked.id) >= 0 ? '<button class="btn btn-secondary btn-sm btn-block" data-action="to-bench" data-id="' + picked.id + '">Move ' + esc(firstName(picked)) + ' to the bench</button>' : '') + '</div>';
      const outs = ROSTERS.stars.filter(p => p.out);

      body.innerHTML = seg +
        '<section class="section">' + pitch + hint + '</section>' +
        '<section class="section"><div class="od-row section-head"><h2 class="od-fill">Bench · ' + benchP.length + '</h2>' +
        '<button class="btn btn-secondary btn-sm od-fixed" data-action="autofill"' + (filled === n || !benchP.length ? ' disabled' : '') + '>Auto-fill</button>' +
        '<button class="btn btn-secondary btn-sm od-fixed" data-action="lineup-clear"' + (filled === 0 ? ' disabled' : '') + '>Clear</button></div>' + tray +
        (outs.length ? '<p class="small muted">Out today: ' + outs.map(p => esc(p.name)).join(', ') + '</p>' : '') + '</section>';

      foot.hidden = false;
      foot.innerHTML = '<div class="od-row" style="--od-gap:12px"><div class="od-field od-fill"><span class="detail-main od-nowrap">' + filled + ' of ' + n + ' positions filled</span>' +
        '<span class="small muted" id="koHelp">' + (filled === n ? 'Lineup full.' : 'Fill ' + (n - filled) + ' more to kick off.') + '</span></div>' +
        '<button class="btn btn-primary od-fixed" data-action="kickoff" aria-describedby="koHelp"' + (filled === n ? '' : ' disabled') + '>Kick off</button></div>';
    }

    function openSlotPicker(i) {
      const g = state.gd, pos = g.slots[i].pos;
      const bench = g.bench.map(starById).filter(Boolean).sort((a, b) => (b.pos === pos) - (a.pos === pos));
      openSheet(sheetHead('Choose a ' + POS[pos].toLowerCase(), bench.length ? 'Players in this position first.' : '') +
        (bench.length
          ? '<ul class="pick-list">' + bench.map(p => '<li><button class="pick od-row" data-action="place" data-id="' + p.id + '" data-slot="' + i + '"><span class="jersey od-fixed">' + num(p) + '</span>' +
            '<span class="od-field od-fill"><span class="ev-title od-truncate">' + esc(p.name) + '</span><span class="ev-meta">' + POS[p.pos] + '</span></span>' +
            (p.pos === pos ? '<span class="pick-badge od-fixed">Plays here</span>' : '') + '</button></li>').join('') + '</ul>'
          : '<p class="muted">Bench is empty.</p>'));
    }

    function appearanceSheet() {
      const opts = [['system', 'Match system', 'Follows the phone setting'], ['light', 'Light', ''], ['dark', 'Dark', '']];
      return sheetHead('Appearance', '') + '<div class="pick-list" role="radiogroup" aria-label="Appearance">' +
        opts.map(o => '<button class="pick od-row" role="radio" aria-checked="' + (themePref === o[0]) + '" data-action="theme" data-v="' + o[0] + '"><span class="od-field od-fill"><span class="ev-title">' + o[1] +
          '</span>' + (o[2] ? '<span class="ev-meta">' + o[2] + '</span>' : '') + '</span>' + (themePref === o[0] ? icon('check') : '') + '</button>').join('') + '</div>';
    }

    /* Drag and drop for the lineup builder (pointer events; tap-to-place is the equivalent path). */
    let drag = null, suppressClick = false;
    const phoneScreen = $('[data-phone-screen]');
    const zoomFactor = () => (phoneScreen.getBoundingClientRect().width / parseFloat(getComputedStyle(phoneScreen).width)) || 1;
    const dropAt = (x, y) => { const el = document.elementFromPoint(x, y); return el ? el.closest('[data-drop]') : null; };
    const clearDrop = () => $$('.is-drop').forEach(el => el.classList.remove('is-drop'));
    document.addEventListener('pointerdown', ev => {
      if (state.gd.phase !== 'pre' || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
      const el = ev.target.closest('[data-drag]');
      if (el) drag = { el: el, id: el.dataset.drag, x: ev.clientX, y: ev.clientY, pointer: ev.pointerId, on: false, z: 1, target: null };
    });
    document.addEventListener('pointermove', ev => {
      if (!drag || ev.pointerId !== drag.pointer) return;
      const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
      if (!drag.on) {
        if (Math.hypot(dx, dy) < 8) return;
        drag.on = true;
        drag.z = zoomFactor();
        drag.el.classList.add('is-dragging');
        try { drag.el.setPointerCapture(drag.pointer); } catch (e) {}
      }
      drag.el.style.transform = 'translate(' + (dx / drag.z) + 'px,' + (dy / drag.z) + 'px) scale(1.08)';
      const target = dropAt(ev.clientX, ev.clientY);
      if (target !== drag.target) { clearDrop(); if (target) target.classList.add('is-drop'); drag.target = target; }
    });
    function endDrag(ev, cancelled) {
      if (!drag || ev.pointerId !== drag.pointer) return;
      const d = drag;
      drag = null;
      if (!d.on) return;
      suppressClick = true;
      setTimeout(() => { suppressClick = false; }, 60);
      const target = cancelled ? null : dropAt(ev.clientX, ev.clientY);
      clearDrop();
      d.el.classList.remove('is-dragging');
      d.el.style.transform = '';
      if (!target) return;
      const key = target.dataset.drop;
      if (key === 'bench') { if (slotIndexOf(d.id) >= 0) { benchPlayer(d.id); render(); } }
      else {
        const i = Number(key.split(':')[1]);
        if (state.gd.slots[i] && state.gd.slots[i].pid !== d.id) { placePlayer(d.id, i); render(); }
      }
    }
    document.addEventListener('pointerup', ev => endDrag(ev, false));
    document.addEventListener('pointercancel', ev => endDrag(ev, true));

    /* ---------- Practice ---------- */
    function renderPractice() {
      const t = curTeam();
      const bar = $('#bar-practice');
      const body = $('#body-practice');
      bar.innerHTML = '<div class="od-field"><p class="screen-kicker">' + esc(t.name) + '</p><h1>Practice plan</h1></div>';
      if (t.id !== 'stars') {
        body.innerHTML = emptyState('clipboard', 'No practice plan yet', 'Schedule a practice to build a plan.',
          '<button class="btn btn-primary" data-action="add-event" data-v="practice">' + icon('plus') + 'Schedule practice</button>' +
          '<button class="btn btn-secondary" data-action="team" data-id="stars">Switch to Shooting Stars</button>');
        return;
      }
      const next = EVENTS.filter(e => e.team === 'stars' && e.type === 'practice' && !isPast(e)).sort(evSort)[0];
      const start = next ? next.time : '17:00';
      const total = state.plan.reduce((a, b) => a + b.min, 0);
      const diff = total - SESSION_MIN;
      const status = diff === 0 ? '<span class="plan-status is-ok od-row" style="--od-gap:4px">' + icon('check', 'icon-sm') + 'Fits the ' + SESSION_MIN + '-minute session</span>'
        : '<span class="plan-status is-off od-row" style="--od-gap:4px">' + icon('alert', 'icon-sm') + Math.abs(diff) + ' min ' + (diff > 0 ? 'over' : 'under') + ' the ' + SESSION_MIN + '-minute session</span>';

      const info = next
        ? '<section class="card next-practice"><span class="ev-tag is-practice">' + icon('cone', 'icon-sm') + 'Next practice</span>' +
          '<p class="ev-title od-nowrap">' + fmtDay(next.date) + ' · ' + fmtTime(next.time) + '</p><p class="ev-meta">' + esc(next.venue) + '</p></section>'
        : '<section class="card next-practice"><p class="ev-title">No practice scheduled</p><p class="ev-meta">This plan will attach to the next practice you add.</p></section>';

      const stats = '<p class="summary-line">' + total + ' min planned · ' + plural(state.plan.length, 'drill', 'drills') + ' · ends ' + fmtTime(addMin(start, total)) + '</p>';

      let offset = 0;
      const blocks = state.plan.map((b, i) => {
        const s = fmtTime(addMin(start, offset)).replace(/ (AM|PM)$/, '');
        offset += b.min;
        return '<li class="block od-row"><div class="block-time od-cell od-fixed"><span class="block-start">' + s + '</span><span class="block-dur">' + b.min + ' min</span></div>' +
          '<button class="block-body od-field od-fill" data-action="drill" data-i="' + i + '"><span class="block-cat">' + esc(b.cat) + '</span><span class="block-title">' + esc(b.title) + '</span></button>' +
          '<button class="icon-btn od-fixed" data-action="block-up" data-i="' + i + '" aria-label="Move ' + esc(b.title) + ' earlier"' + (i === 0 ? ' disabled' : '') + '>' + icon('chev-up') + '</button>' +
          '<button class="icon-btn od-fixed" data-action="block-down" data-i="' + i + '" aria-label="Move ' + esc(b.title) + ' later"' + (i === state.plan.length - 1 ? ' disabled' : '') + '>' + icon('chev-down') + '</button></li>';
      }).join('');

      const list = state.plan.length ? '<ul class="block-list">' + blocks + '</ul>'
        : emptyState('clipboard', 'No drills yet', 'Add a drill to start.', '');

      body.innerHTML = info + stats +
        '<section class="section"><div class="od-field"><h2>Session timeline</h2>' + status + '</div>' + list +
        '<button class="btn btn-primary btn-block" data-action="add-drill">' + icon('plus') + 'Add drill</button>' +
        '<p class="small muted">Tap a drill for coaching points. Use the arrows to reorder.</p></section>';
    }

    /* ---------- Team ---------- */
    function rosterStatus(p, teamId) {
      if (p.out) return 'out';
      if (teamId === 'stars' && !matchOver() && state.gd.slots.some(s => s.pid === p.id)) return matchLive() ? 'field' : 'lineup';
      return 'avail';
    }
    function renderTeam() {
      const t = curTeam();
      const r = roster();
      $('#bar-team').innerHTML = '<div class="od-row"><h1 class="od-fill">Team</h1>' +
        '<button class="btn btn-primary btn-sm od-fixed" data-action="add-player">' + icon('plus') + 'Add player</button></div>';

      let html = teamRail();
      if (!r.length) {
        html += emptyState('users', 'No players yet', 'Add players to track availability and minutes.',
          '<button class="btn btn-primary" data-action="add-player">' + icon('plus') + 'Add first player</button>');
      } else {
        const avail = r.filter(p => !p.out).length;
        html += '<div class="seg" role="group" aria-label="Filter roster">' +
          [['all', 'All ' + r.length], ['avail', 'Available ' + avail], ['out', 'Out ' + (r.length - avail)]].map(x => '<button data-action="roster-filter" data-v="' + x[0] + '" aria-pressed="' + (state.rosterFilter === x[0]) + '">' + x[1] + '</button>').join('') + '</div>';
        const shown = r.filter(p => state.rosterFilter === 'all' || (state.rosterFilter === 'out') === p.out)
          .slice().sort((a, b) => (a.n == null ? 999 : a.n) - (b.n == null ? 999 : b.n));
        const label = { out: ['is-out', 'ban', 'Out'], field: ['is-ok', 'ball', 'On the field'], lineup: ['is-ok', 'ball', 'Starting'], avail: ['is-ok', 'check', 'Available'] };
        html += '<section class="section"><h2>Roster</h2>' + (shown.length
          ? '<ul class="event-list">' + shown.map(p => {
              const l = label[rosterStatus(p, t.id)];
              return '<li><button class="roster-row od-row" data-action="player" data-id="' + p.id + '"><span class="jersey od-fixed">' + (p.n == null ? '–' : p.n) + '</span>' +
                '<span class="od-field od-fill"><span class="ev-title od-truncate">' + esc(p.name) + '</span><span class="ev-meta">' + POS[p.pos] + '</span></span>' +
                '<span class="pstatus ' + l[0] + ' od-fixed od-nowrap">' + icon(l[1], 'icon-sm') + l[2] + '</span></button></li>';
            }).join('') + '</ul>'
          : emptyState('check-circle', state.rosterFilter === 'out' ? 'Nobody is out' : 'Nobody is available', state.rosterFilter === 'out' ? 'Everyone is available.' : 'Every player is marked out.',
              '<button class="btn btn-secondary" data-action="roster-filter" data-v="all">Show all players</button>')) + '</section>';
      }
      html += '<div class="brand-foot"><div class="brand-tile"><img class="od-media" src="assets/artizo-mark.png" width="660" height="600" alt="Artizo Sport logo"></div></div>';
      $('#body-team').innerHTML = html;
    }

    /* ---------- rendering + routing ---------- */
    const ROUTES = ['home', 'calendar', 'gameday', 'practice', 'team'];
    const RENDER = { home: renderHome, calendar: renderCalendar, gameday: renderGameday, practice: renderPractice, team: renderTeam };
    const fidOf = el => [el.dataset.action, el.dataset.id, el.dataset.slot, el.dataset.i, el.dataset.v].join('|');
    function keepFocus(root, fn) {
      const a = document.activeElement;
      const key = a && a.dataset && a.dataset.action && root.contains(a) ? fidOf(a) : null;
      fn();
      if (key) { const el = $$('[data-action]', root).find(x => fidOf(x) === key); if (el && !el.disabled) el.focus({ preventScroll: true }); }
    }
    const scrollerOf = r => $('#body-' + r);
    function render(r) { r = r || state.route; keepFocus($('#screen-' + r), RENDER[r]); syncLive(); }

    function show(r) {
      const prev = state.route;
      const prevEl = $('#screen-' + prev);
      if (prevEl && !prevEl.hidden) state.scroll[prev] = scrollerOf(prev).scrollTop;
      ROUTES.forEach(x => { $('#screen-' + x).hidden = x !== r; });
      state.route = r;
      render(r);
      scrollerOf(r).scrollTop = state.scroll[r] || 0;
      $$('.tabbar a').forEach(a => { if (a.dataset.tab === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
      if (prev !== r || !prevEl) {
        const el = $('#screen-' + r);
        el.classList.add('is-entering');
        el.addEventListener('animationend', () => el.classList.remove('is-entering'), { once: true });
      }
    }
    function onRoute() {
      const r = location.hash.replace(/^#\/?/, '');
      closeSheet(true);
      show(ROUTES.indexOf(r) >= 0 ? r : 'home');
    }

    function syncLive() {
      const live = matchLive();
      $('#tabLive').hidden = !live;
      $('#tabLiveText').hidden = !live;
    }

    /* ---------- match clock ---------- */
    function tick() {
      const g = state.gd;
      if (!g.running) return;
      g.sec += 1;
      g.slots.forEach(s => { starById(s.pid).sec += 1; });
      let phaseChanged = false;
      if (g.phase === 'live1' && g.sec >= HALF) { g.phase = 'ht'; g.running = false; phaseChanged = true; }
      else if (g.phase === 'live2' && g.sec >= HALF * 2) { g.phase = 'ft'; g.running = false; phaseChanged = true; }
      $$('[data-clock]').forEach(el => { el.textContent = fmtClock(g.sec); });
      if (phaseChanged || g.sec % 60 === 0) {
        if (state.route !== 'practice') render();
        if (phaseChanged) toast(g.phase === 'ht' ? 'Half time. Clock paused at 25:00.' : 'Full time. Final score ' + g.us + '–' + g.them + '.');
      }
    }

    /* ---------- sheets ---------- */
    const layer = $('#sheetLayer'), sheet = $('#sheet');
    let opener = null, closeTimer = null;
    const sheetHead = (title, sub) =>
      '<div class="sheet-head od-row-top"><div class="od-field od-fill"><h2 id="sheetTitle" tabindex="-1">' + title + '</h2>' + (sub ? '<p class="muted small">' + sub + '</p>' : '') + '</div>' +
      '<button class="icon-btn is-outlined od-fixed" data-action="close" aria-label="Close">' + icon('x') + '</button></div>';

    function openSheet(html) {
      clearTimeout(closeTimer);
      if (layer.hidden) opener = document.activeElement;
      sheet.innerHTML = html;
      sheet.scrollTop = 0;
      layer.hidden = false;
      void layer.offsetWidth;
      layer.classList.add('is-open');
      const h = $('#sheetTitle', sheet);
      if (h) h.focus({ preventScroll: true });
    }
    function setSheet(html) { keepFocus(sheet, () => { sheet.innerHTML = html; }); }
    function closeSheet(instant) {
      if (layer.hidden) return;
      layer.classList.remove('is-open');
      const done = () => { layer.hidden = true; sheet.innerHTML = ''; };
      clearTimeout(closeTimer);
      if (instant) done(); else closeTimer = setTimeout(done, 210);
      if (opener && opener.dataset && opener.dataset.action) {
        const key = fidOf(opener);
        const el = $$('[data-action]', $('#app')).find(x => fidOf(x) === key && x.offsetParent !== null);
        if (el) el.focus({ preventScroll: true });
      }
      opener = null;
    }

    /* ---------- toast ---------- */
    const toastEl = $('#toast');
    let toastTimer = null, undoFn = null;
    function toast(msg, undo) {
      clearTimeout(toastTimer);
      undoFn = undo || null;
      toastEl.hidden = true;
      toastEl.innerHTML = '<span class="toast-msg">' + esc(msg) + '</span>' + (undo ? '<button type="button" data-action="undo">Undo</button>' : '');
      void toastEl.offsetWidth;
      toastEl.hidden = false;
      toastTimer = setTimeout(() => { toastEl.hidden = true; undoFn = null; }, undo ? 6000 : 3500);
    }

    /* ---------- event sheet ---------- */
    function openEvent(id) {
      const e = EVENTS.find(x => x.id === id);
      if (!e) return;
      const t = teamById(e.team);
      const live = isLive(e), past = isPast(e);
      const sc = evScore(e);
      const tag = live ? '<span class="ev-tag is-live"><span class="live-dot"></span>Live now · ' + phaseLabel() + '</span>'
        : '<span class="ev-tag is-' + e.type + '">' + icon(e.type === 'match' ? 'ball' : 'cone', 'icon-sm') + (e.type === 'match' ? 'Match' : 'Practice') + (past ? ' · ' + (e.type === 'match' ? 'Played' : 'Done') : '') + '</span>';
      const r = roster(e.team);
      const going = r.filter(p => !p.out).length;
      let rows =
        '<div class="detail-row od-row-top">' + icon('clock') + '<div class="od-field od-fill"><span class="detail-main od-nowrap">' + fmtDay(e.date) + ' · ' + fmtTime(e.time) + '</span>' +
        (live || (past && e.type === 'match' && sc) ? '<span class="muted small">' + (live ? 'Score ' + sc[0] + '–' + sc[1] : 'Final · ' + resultText(sc)) + '</span>' : '') + '</div></div>' +
        '<div class="detail-row od-row-top">' + icon('pin') + '<div class="od-field od-fill"><span class="detail-main">' + esc(e.venue || 'Location not set') + '</span>' + (e.address ? '<span class="muted small">' + esc(e.address) + '</span>' : '') + '</div></div>' +
        '<div class="detail-row od-row-top">' + icon('users') + '<div class="od-field od-fill"><span class="detail-main">' + esc(t.name) + '</span>' +
        (!past && r.length ? '<span class="muted small">' + going + ' available · ' + (r.length - going) + ' out</span>' : '') + '</div></div>';
      let actions = '';
      if (live) actions += '<a class="btn btn-primary btn-block" href="#/gameday">Open gameday</a>';
      else if (isPre(e)) actions += '<a class="btn btn-primary btn-block" href="#/gameday">Set lineup</a>';
      else if (!past && e.type === 'practice' && e.team === 'stars') actions += '<a class="btn btn-primary btn-block" href="#/practice">Open practice plan</a>';
      if (e.address) actions += '<a class="btn btn-secondary btn-block" target="_blank" rel="noopener" href="https://maps.apple.com/?q=' + encodeURIComponent(e.venue + ', ' + e.address) + '">' + icon('nav') + 'Directions</a>';
      openSheet(sheetHead(esc(evTitle(e)), '') + tag + '<div class="od-stack" style="--od-gap:16px">' + rows + '</div>' + (actions ? '<div class="sheet-actions">' + actions + '</div>' : ''));
    }

    /* ---------- substitutions + goals ---------- */
    function doSwap(inId, slotIdx) {
      const g = state.gd;
      const outId = g.slots[slotIdx].pid;
      const bi = g.bench.indexOf(inId);
      if (bi < 0) return;
      g.slots[slotIdx].pid = inId;
      g.bench[bi] = outId;
      closeSheet();
      render();
      toast(starById(inId).name + ' on for ' + starById(outId).name + ' · ' + fmtClock(g.sec), () => {
        const s = g.slots[slotIdx], b = g.bench.indexOf(outId);
        if (s.pid === inId && b >= 0) { s.pid = outId; g.bench[b] = inId; render(); toast('Sub undone.'); }
      });
    }
    function pickRow(p, pos, action, attrs, badge) {
      return '<li><button class="pick od-row" data-action="' + action + '" ' + attrs + '><span class="jersey od-fixed">' + p.n + '</span>' +
        '<span class="od-field od-fill"><span class="ev-title od-truncate">' + esc(p.name) + '</span><span class="ev-meta od-nowrap">' + POS[pos] + ' · ' + mins(p.sec) + ' min</span></span>' +
        (badge ? '<span class="pick-badge od-fixed">' + badge + '</span>' : '') + '</button></li>';
    }
    function openSubIn(inId) {
      const g = state.gd, p = starById(inId);
      const field = g.slots.map((s, i) => ({ i: i, pos: s.pos, p: starById(s.pid) })).sort((a, b) => (a.pos === 'GK') - (b.pos === 'GK') || b.p.sec - a.p.sec);
      openSheet(sheetHead('Sub in ' + esc(p.name), 'Who comes off? Most minutes first.') +
        '<ul class="pick-list">' + field.map((x, k) => pickRow(x.p, x.pos, 'swap', 'data-id="' + inId + '" data-slot="' + x.i + '"', k === 0 ? 'Most minutes' : '')).join('') + '</ul>');
    }
    function openSubOut(slotIdx) {
      const g = state.gd, p = starById(g.slots[slotIdx].pid);
      const bench = g.bench.map(starById).filter(Boolean).sort((a, b) => a.sec - b.sec);
      openSheet(sheetHead('Sub off ' + esc(p.name), bench.length ? 'Who comes on? Fewest minutes first.' : '') +
        (bench.length ? '<ul class="pick-list">' + bench.map((b, k) => pickRow(b, b.pos, 'swap', 'data-id="' + b.id + '" data-slot="' + slotIdx + '"', k === 0 ? 'Fewest minutes' : '')).join('') + '</ul>'
          : '<p class="muted">Bench is empty.</p>'));
    }
    function openScorer() {
      const g = state.gd;
      const field = g.slots.map(s => ({ pos: s.pos, p: starById(s.pid) })).reverse();
      openSheet(sheetHead('Who scored?', 'Goal at ' + fmtClock(g.sec)) +
        '<ul class="pick-list">' + field.map(x => pickRow(x.p, x.pos, 'scorer', 'data-id="' + x.p.id + '"', x.p.goals ? plural(x.p.goals, 'goal', 'goals') : '')).join('') + '</ul>' +
        '<button class="btn btn-secondary btn-block" data-action="scorer" data-id="">Skip, not sure who scored</button>');
    }

    /* ---------- drill sheets ---------- */
    function drillSheet(i, confirm) {
      const b = state.plan[i];
      const danger = confirm
        ? '<div class="confirm" role="alert"><p><strong>Remove ' + esc(b.title) + ' from this plan?</strong></p><div class="sheet-actions is-pair">' +
          '<button class="btn btn-secondary" data-action="drill" data-i="' + i + '">Keep it</button><button class="btn btn-danger-solid" data-action="drill-remove-yes" data-i="' + i + '">Remove</button></div></div>'
        : '<button class="btn btn-danger btn-block" data-action="drill-remove" data-i="' + i + '">Remove from plan</button>';
      return sheetHead(esc(b.title), esc(b.cat)) +
        '<p>' + esc(b.desc) + '</p>' +
        '<div class="od-stack"><h3>Set-up</h3><p>' + esc(b.setup) + '</p></div>' +
        '<div class="od-stack"><h3>Coaching points</h3><ul class="points">' + b.points.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>' +
        '<div class="od-stack"><h3 id="durLabel">Duration</h3><div class="stepper od-row" role="group" aria-labelledby="durLabel">' +
          '<button class="icon-btn is-outlined od-fixed" data-action="drill-dur" data-i="' + i + '" data-v="-5" aria-label="5 minutes shorter"' + (b.min <= 5 ? ' disabled' : '') + '>' + icon('minus') + '</button>' +
          '<span class="stepper-val" aria-live="polite">' + b.min + ' min</span>' +
          '<button class="icon-btn is-outlined od-fixed" data-action="drill-dur" data-i="' + i + '" data-v="5" aria-label="5 minutes longer"' + (b.min >= 30 ? ' disabled' : '') + '>' + icon('plus') + '</button></div></div>' +
        danger;
    }
    function openDrillPicker() {
      openSheet(sheetHead('Add a drill', 'Adds to the end of the session.') +
        '<ul class="pick-list">' + Object.keys(DRILLS).map(k => { const d = DRILLS[k];
          return '<li><button class="pick od-row" data-action="pick-drill" data-id="' + k + '"><span class="od-field od-fill"><span class="ev-title">' + esc(d.title) + '</span><span class="ev-meta od-nowrap">' + esc(d.cat) + ' · ' + d.min + ' min</span></span>' + icon('plus', 'chev') + '</button></li>'; }).join('') + '</ul>');
    }

    /* ---------- player sheet ---------- */
    function playerSheet(id) {
      const tId = state.team, p = roster().find(x => x.id === id);
      if (!p) return '';
      const st = rosterStatus(p, tId);
      const onField = st === 'field';
      const today = tId === 'stars' ? '<p class="summary-line">Today: ' + mins(p.sec) + ' min played · ' + plural(p.goals, 'goal', 'goals') + '</p>' : '';
      return '<div class="sheet-head od-row" style="--od-gap:12px"><span class="jersey is-lg od-fixed">' + (p.n == null ? '–' : p.n) + '</span>' +
        '<div class="od-field od-fill"><h2 id="sheetTitle" tabindex="-1">' + esc(p.name) + '</h2><p class="muted small">' + POS[p.pos] + ' · ' + esc(curTeam().name) + '</p></div>' +
        '<button class="icon-btn is-outlined od-fixed" data-action="close" aria-label="Close">' + icon('x') + '</button></div>' + today +
        '<div class="switch-row od-row"><div class="od-field od-fill"><span class="detail-main" id="availLabel">Available</span>' +
        '<span class="muted small">' + (onField ? 'On the field now. Sub them off before marking them out.' : p.out ? 'Left off the bench and the minutes target.' : 'Turn off if they cannot make the next event.') + '</span></div>' +
        '<span class="switch-tap od-fixed"><button class="switch" role="switch" data-action="toggle-avail" data-id="' + p.id + '" aria-checked="' + !p.out + '" aria-labelledby="availLabel"' + (onField ? ' disabled' : '') + '><span class="switch-knob"></span></button></span></div>';
    }

    /* ---------- forms ---------- */
    const field = (name, label, control, required) =>
      '<div class="field" data-field="' + name + '"><label for="f-' + name + '">' + label + (required ? ' <span class="req">(required)</span>' : ' <span class="req">(optional)</span>') + '</label>' + control +
      '<p class="field-err" id="f-' + name + '-err" hidden></p></div>';

    function openEventForm(preType) {
      const type = preType || 'practice';
      openSheet(sheetHead('Add event', '') +
        '<form class="form" data-form="event" novalidate><div class="err-summary" role="alert" tabindex="-1" hidden></div>' +
        '<div class="field"><label for="f-team">Team <span class="req">(required)</span></label><select id="f-team" name="team">' + TEAMS.map(t => '<option value="' + t.id + '"' + (t.id === state.team ? ' selected' : '') + '>' + esc(t.name) + '</option>').join('') + '</select></div>' +
        '<fieldset class="field"><legend>Type <span class="req">(required)</span></legend><div class="radio-seg">' +
          '<label><input type="radio" name="type" value="practice"' + (type === 'practice' ? ' checked' : '') + '>Practice</label>' +
          '<label><input type="radio" name="type" value="match"' + (type === 'match' ? ' checked' : '') + '>Match</label></div></fieldset>' +
        '<div class="field-pair">' +
          field('date', 'Date', '<input id="f-date" name="date" type="date" value="2026-10-08" aria-describedby="f-date-err">', true) +
          field('time', 'Start time', '<input id="f-time" name="time" type="time" value="17:00" aria-describedby="f-time-err">', true) + '</div>' +
        '<div id="oppWrap"' + (type === 'match' ? '' : ' hidden') + '>' + field('opp', 'Opponent', '<input id="f-opp" name="opp" type="text" autocomplete="off" aria-describedby="f-opp-err">', true) + '</div>' +
        field('loc', 'Location', '<input id="f-loc" name="loc" type="text" autocomplete="off" aria-describedby="f-loc-err">', true) +
        '<button class="btn btn-primary btn-block" type="submit">Save event</button></form>');
    }
    function openPlayerForm() {
      openSheet(sheetHead('Add player', 'Joining ' + esc(curTeam().name)) +
        '<form class="form" data-form="player" novalidate><div class="err-summary" role="alert" tabindex="-1" hidden></div>' +
        field('name', 'Player name', '<input id="f-name" name="name" type="text" autocomplete="off" aria-describedby="f-name-err">', true) +
        '<div class="field-pair">' +
          field('num', 'Jersey number', '<input id="f-num" name="num" type="text" inputmode="numeric" autocomplete="off" aria-describedby="f-num-err">', false) +
          '<div class="field"><label for="f-pos">Position <span class="req">(required)</span></label><select id="f-pos" name="pos">' + Object.keys(POS).map(k => '<option value="' + k + '"' + (k === 'MID' ? ' selected' : '') + '>' + POS[k] + '</option>').join('') + '</select></div></div>' +
        '<button class="btn btn-primary btn-block" type="submit">Add to roster</button></form>');
    }

    const RULES = {
      event: {
        date: v => v ? '' : 'Pick a date for the event.',
        time: v => v ? '' : 'Enter a start time, for example 5:00 PM.',
        opp: (v, f) => f.elements.type.value === 'match' && !v.trim() ? 'Enter the opponent, or TBD if it is not known yet.' : '',
        loc: v => v.trim() ? '' : 'Enter where it takes place, for example Twin Oaks Park.'
      },
      player: {
        name: v => v.trim() ? '' : 'Enter the player’s name, for example Maya R.',
        num: v => {
          v = v.trim();
          if (!v) return '';
          if (!/^\d{1,2}$/.test(v) || Number(v) < 1) return 'Use a number from 1 to 99, or leave it blank.';
          const taken = roster().find(p => p.n === Number(v));
          return taken ? 'Number ' + v + ' is worn by ' + taken.name + '. Pick another.' : '';
        }
      }
    };
    const FIELD_LABEL = { date: 'Date', time: 'Start time', opp: 'Opponent', loc: 'Location', name: 'Player name', num: 'Jersey number' };
    function validateField(form, name) {
      const rule = RULES[form.dataset.form][name];
      const input = form.elements[name];
      if (!rule || !input) return '';
      const msg = rule(input.value, form);
      const err = $('#f-' + name + '-err', form);
      if (msg) { err.innerHTML = icon('alert', 'icon-sm') + '<span>' + esc(msg) + '</span>'; err.hidden = false; input.setAttribute('aria-invalid', 'true'); }
      else { err.hidden = true; err.textContent = ''; input.removeAttribute('aria-invalid'); }
      return msg;
    }
    function validateForm(form) {
      const errs = Object.keys(RULES[form.dataset.form]).map(n => ({ name: n, msg: validateField(form, n) })).filter(x => x.msg);
      const sum = $('.err-summary', form);
      if (errs.length) {
        sum.innerHTML = '<strong>' + plural(errs.length, 'thing needs', 'things need') + ' fixing before this can be saved:</strong>' +
          errs.map(e => '<button type="button" class="err-link" data-action="focus-field" data-id="' + e.name + '">' + FIELD_LABEL[e.name] + '</button>').join('');
        sum.hidden = false;
        if (errs.length > 1) sum.focus(); else form.elements[errs[0].name].focus();
      } else sum.hidden = true;
      return !errs.length;
    }
    function saving(form, done) {
      const btn = $('[type="submit"]', form);
      btn.disabled = true;
      btn.textContent = 'Saving…';
      setTimeout(done, 450);
    }
    function submitForm(form) {
      if (!validateForm(form)) return;
      const el = form.elements;
      if (form.dataset.form === 'event') {
        const v = { team: el.team.value, type: el.type.value, date: el.date.value, time: el.time.value, opp: el.opp.value.trim(), loc: el.loc.value.trim() };
        saving(form, () => {
          EVENTS.push({ id: 'u' + (++uid), team: v.team, type: v.type, date: v.date, time: v.time, opp: v.opp, oppFrom: '', venue: v.loc, address: '' });
          state.cal.week = weekStart(v.date);
          state.cal.day = null;
          closeSheet();
          render();
          toast((v.type === 'match' ? 'Match' : 'Practice') + ' added for ' + fmtDay(v.date) + '.');
        });
      } else {
        const num = el.num.value.trim();
        const p = { id: 'p' + (++uid), n: num ? Number(num) : null, name: el.name.value.trim(), pos: el.pos.value, sec: 0, goals: 0, out: false };
        saving(form, () => {
          roster().push(p);
          if (state.team === 'stars') state.gd.bench.push(p.id);
          state.rosterFilter = 'all';
          closeSheet();
          render();
          toast(p.name + ' added to ' + curTeam().name + '.');
        });
      }
    }

    /* ---------- actions ---------- */
    const A = {
      'team': el => { state.team = el.dataset.id; state.rosterFilter = 'all'; render(); },
      'home-day': el => { state.cal.week = weekStart(el.dataset.id); state.cal.day = el.dataset.id; state.cal.team = state.team; state.cal.type = 'all'; state.scroll.calendar = 0; location.hash = '#/calendar'; },
      'cal-day': el => { state.cal.day = state.cal.day === el.dataset.id ? null : el.dataset.id; render(); },
      'cal-prev': () => { state.cal.week = addDays(state.cal.week, -7); state.cal.day = null; render(); },
      'cal-next': () => { state.cal.week = addDays(state.cal.week, 7); state.cal.day = null; render(); },
      'cal-today': () => { state.cal.week = weekStart(TODAY); state.cal.day = null; render(); },
      'cal-week': () => { state.cal.day = null; render(); },
      'cal-team': el => { state.cal.team = el.dataset.id; render(); },
      'cal-type': el => { state.cal.type = el.dataset.v; render(); },
      'cal-clear': () => { state.cal.team = 'all'; state.cal.type = 'all'; render(); },
      'event': el => openEvent(el.dataset.id),
      'add-event': el => openEventForm(el.dataset.v),
      'close': () => closeSheet(),
      'undo': () => { const fn = undoFn; undoFn = null; toastEl.hidden = true; if (fn) fn(); },

      'appearance': () => openSheet(appearanceSheet()),
      'theme': el => { themePref = okTheme(el.dataset.v) || 'system'; themeStore.set(themePref); applyTheme(); setSheet(appearanceSheet()); },

      'gd-formation': el => { setFormation(el.dataset.v); render(); announce('Formation ' + el.dataset.v + '. ' + filledCount() + ' of ' + state.gd.slots.length + ' positions filled.'); },
      'pick': el => {
        state.pick = state.pick === el.dataset.id ? null : el.dataset.id;
        render();
        if (state.pick) announce(starById(state.pick).name + ' selected. Choose a position.');
      },
      'slot': el => {
        const i = Number(el.dataset.slot), x = state.gd.slots[i];
        if (state.pick && state.pick !== x.pid) { placePlayer(state.pick, i); render(); }
        else if (x.pid) {
          state.pick = state.pick === x.pid ? null : x.pid;
          render();
          if (state.pick) announce(starById(state.pick).name + ' selected. Choose another position to swap, or move them to the bench.');
        } else openSlotPicker(i);
      },
      'place': el => { placePlayer(el.dataset.id, Number(el.dataset.slot)); closeSheet(); render(); },
      'to-bench': el => { benchPlayer(el.dataset.id); render(); },
      'autofill': () => { autoFill(); render(); announce('Lineup filled. ' + filledCount() + ' of ' + state.gd.slots.length + ' positions filled.'); },
      'lineup-clear': () => { clearLineup(); render(); announce('Lineup cleared.'); },
      'kickoff': () => {
        const g = state.gd;
        if (g.phase !== 'pre' || filledCount() < g.slots.length) return;
        g.phase = 'live1'; g.running = true; g.sec = 0; g.us = 0; g.them = 0;
        state.pick = null;
        render();
        scrollerOf('gameday').scrollTop = 0;
        toast('Kicked off.');
      },

      'clock-toggle': () => {
        const g = state.gd;
        if (g.phase === 'ft') return;
        if (g.phase === 'ht') { g.phase = 'live2'; g.running = true; toast('2nd half under way.'); }
        else g.running = !g.running;
        render();
      },
      'goal-us': () => openScorer(),
      'goal-them': () => {
        const g = state.gd; g.them += 1; render();
        toast('Goal for ' + EVENTS.find(e => e.today).opp + ' · ' + fmtClock(g.sec), () => { g.them = Math.max(0, g.them - 1); render(); toast('Goal removed.'); });
      },
      'scorer': el => {
        const g = state.gd, p = el.dataset.id ? starById(el.dataset.id) : null;
        g.us += 1; if (p) p.goals += 1;
        closeSheet(); render();
        toast('Goal: ' + (p ? p.name + ' · ' : '') + fmtClock(g.sec), () => { g.us = Math.max(0, g.us - 1); if (p) p.goals = Math.max(0, p.goals - 1); render(); toast('Goal removed.'); });
      },
      'gd-view': el => { state.gd.view = el.dataset.v; render(); },
      'sub-in': el => openSubIn(el.dataset.id),
      'sub-out': el => openSubOut(Number(el.dataset.slot)),
      'swap': el => doSwap(el.dataset.id, Number(el.dataset.slot)),
      'suggest-swap': () => { const s = fair().suggestion; if (s) doSwap(s.inId, s.slot); },

      'drill': el => { const i = Number(el.dataset.i); if (layer.hidden) openSheet(drillSheet(i)); else setSheet(drillSheet(i)); },
      'drill-dur': el => { const i = Number(el.dataset.i), b = state.plan[i]; b.min = Math.min(30, Math.max(5, b.min + Number(el.dataset.v))); setSheet(drillSheet(i)); render(); },
      'drill-remove': el => { setSheet(drillSheet(Number(el.dataset.i), true)); const k = $('.confirm .btn-secondary', sheet); if (k) k.focus(); },
      'drill-remove-yes': el => { const b = state.plan.splice(Number(el.dataset.i), 1)[0]; closeSheet(); render(); toast(b.title + ' removed from the plan.'); },
      'block-up': el => { const i = Number(el.dataset.i); if (i > 0) { const p = state.plan; p.splice(i - 1, 0, p.splice(i, 1)[0]); render(); focusBlock('block-up', i - 1, 'block-down'); } },
      'block-down': el => { const i = Number(el.dataset.i), p = state.plan; if (i < p.length - 1) { p.splice(i + 1, 0, p.splice(i, 1)[0]); render(); focusBlock('block-down', i + 1, 'block-up'); } },
      'add-drill': () => openDrillPicker(),
      'pick-drill': el => {
        const b = planItem(el.dataset.id); state.plan.push(b);
        const total = state.plan.reduce((a, x) => a + x.min, 0), diff = total - SESSION_MIN;
        closeSheet(); render();
        scrollerOf('practice').scrollTop = scrollerOf('practice').scrollHeight;
        toast(b.title + ' added. Plan is ' + total + ' min' + (diff ? ', ' + Math.abs(diff) + ' ' + (diff > 0 ? 'over' : 'under') : '') + '.');
      },

      'roster-filter': el => { state.rosterFilter = el.dataset.v; render(); },
      'player': el => openSheet(playerSheet(el.dataset.id)),
      'toggle-avail': el => {
        const p = roster().find(x => x.id === el.dataset.id);
        if (!p) return;
        p.out = !p.out;
        if (state.team === 'stars') {
          const b = state.gd.bench, i = b.indexOf(p.id);
          if (p.out) state.gd.slots.forEach(x => { if (x.pid === p.id) x.pid = null; });
          if (p.out && i >= 0) b.splice(i, 1);
          if (!p.out && i < 0 && !state.gd.slots.some(s => s.pid === p.id)) b.push(p.id);
        }
        setSheet(playerSheet(p.id));
        render();
      },
      'add-player': () => openPlayerForm(),
      'focus-field': el => { const f = el.closest('form'); if (f && f.elements[el.dataset.id]) f.elements[el.dataset.id].focus(); }
    };
    // After a reorder the moved drill keeps focus; fall back to the other arrow at the list ends.
    function focusBlock(action, i, fallback) {
      const q = a => $('[data-action="' + a + '"][data-i="' + i + '"]', $('#body-practice'));
      const el = q(action);
      const target = el && !el.disabled ? el : q(fallback);
      if (target) target.focus({ preventScroll: true });
    }

    document.addEventListener('click', ev => {
      const el = ev.target.closest('[data-action]');
      if (!el || el.disabled || suppressClick) return;
      const fn = A[el.dataset.action];
      if (fn) fn(el, ev);
    });
    sheet.addEventListener('submit', ev => { ev.preventDefault(); submitForm(ev.target); });
    sheet.addEventListener('focusout', ev => {
      const f = ev.target.form;
      if (f && f.dataset.form && ev.target.name && RULES[f.dataset.form][ev.target.name]) validateField(f, ev.target.name);
    });
    sheet.addEventListener('change', ev => {
      if (ev.target.name === 'type') {
        const wrap = $('#oppWrap', sheet);
        wrap.hidden = ev.target.value !== 'match';
        if (wrap.hidden) validateField(ev.target.form, 'opp');
      }
    });
    document.addEventListener('keydown', ev => {
      if (layer.hidden) return;
      if (ev.key === 'Escape') { ev.preventDefault(); closeSheet(); return; }
      if (ev.key !== 'Tab') return;
      const items = $$('button, a[href], input, select, [tabindex="0"]', sheet).filter(x => !x.disabled && x.offsetParent !== null);
      if (!items.length) { ev.preventDefault(); return; }
      const first = items[0], last = items[items.length - 1];
      if (!sheet.contains(document.activeElement)) { ev.preventDefault(); first.focus(); }
      else if (ev.shiftKey && (document.activeElement === first || document.activeElement === $('#sheetTitle', sheet))) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
    });

    // Comparison boards only: ?state=live opens 22 minutes into the match (no visible control in the app).
    if (new URLSearchParams(location.search).get('state') === 'live') {
      const g = state.gd;
      g.formation = '2-3-1';
      g.slots = [['GK', 's1'], ['DEF', 's4'], ['DEF', 's5'], ['MID', 's8'], ['MID', 's10'], ['MID', 's7'], ['FWD', 's9']].map(x => ({ pos: x[0], pid: x[1] }));
      g.bench = ['s3', 's6', 's11', 's12'];
      const secs = { s1: 1334, s4: 1334, s5: 734, s8: 1334, s10: 1034, s7: 734, s9: 1334, s3: 600, s6: 600, s11: 300, s12: 0 };
      ROSTERS.stars.forEach(p => { if (secs[p.id] != null) p.sec = secs[p.id]; });
      starById('s9').goals = 1;
      g.phase = 'live1'; g.running = true; g.sec = 1334; g.us = 1; g.them = 0;
      const statusClock = document.querySelector('.status-time');
      if (statusClock) statusClock.textContent = '11:02';
    }

    window.addEventListener('hashchange', onRoute);
    onRoute();
    setInterval(tick, 1000);
  })();
  </script>
</body>
</html>

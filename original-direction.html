<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Artizo Sport — coach app prototype</title>
  <script>
    (function () {
      var d = document.documentElement, q = new URLSearchParams(location.search), t = q.get('theme'), saved = null;
      try { saved = localStorage.getItem('artizo-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = (saved === 'light' || saved === 'dark') ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      d.dataset.theme = t;
      if (q.get('embed') === '1') d.classList.add('is-embed');
    })();
  </script>
  <style>
    /* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
       Put this @layer first; product CSS outside the layer always wins. */
    @layer od-layout {
      :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

      /* containers */
      .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
      .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
      .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
      .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
      .od-fill    { flex: 1 1 0; min-width: 0; }
      .od-fixed   { flex: none; }
      .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

      /* stacked information: each piece is its own line — never sibling inline spans */
      .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
      :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
      .od-tile { display: grid; grid-template-rows: auto 1fr; }
      :where(.od-tile) > :where(*) { display: block; }

      /* media keeps its intrinsic ratio by default; never a distorted or cropped
         cover by accident. height:auto lets the ratio win over an <img height="…">
         attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
         AND add .od-media-cover together (per the core rule, only where a crop is
         deliberate — tile thumbs, decorative fills — never on full-frame content). */
      .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
      .od-media-cover { object-fit: cover; }

      /* data text only — authored copy is rewritten to its budget instead */
      .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
      .od-clamp-2 { -webkit-line-clamp: 2; }
      .od-clamp-3 { -webkit-line-clamp: 3; }
      .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */
      .od-nowrap  { white-space: nowrap; }           /* 数字+单位 · 价格+起 · 日期+星期 */
      .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

      /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
      .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
      .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

      /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
      .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
                 padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
      .od-rail::-webkit-scrollbar { display: none; }
      :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
      :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

      .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
      .od-touch  { min-width: 44px; min-height: 44px; }
    }
    /* /OD-LAYOUT-PRIMITIVES v1 */

    @font-face {
      font-family: "Bricolage Grotesque";
      src: url("assets/fonts/bricolage-grotesque-latin.woff2") format("woff2");
      font-weight: 400 800;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Inter";
      src: url("assets/fonts/inter-latin.woff2") format("woff2");
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }

    /* ---------- Handset shell (Open Design neutral shell, kept intact) ---------- */
    :root {
      --phone-screen-width: 390px;
      --phone-screen-height: 844px;
      --phone-bezel: 10px;
      --phone-outer-radius: 52px;
      --phone-screen-radius: 42px;
      --phone-safe-top: 50px;
      --phone-safe-bottom: 29px;
      --phone-system-fg: #17181a;
      --phone-screen-bg: #f8f8f9;
      --phone-stage-bg: #eaebee;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 50% 15%, rgba(255,255,255,.94), transparent 35%),
        var(--phone-stage-bg);
      color: #191a1d;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .phone-frame {
      position: relative;
      width: calc(var(--phone-screen-width) + var(--phone-bezel) * 2);
      height: calc(var(--phone-screen-height) + var(--phone-bezel) * 2);
      padding: var(--phone-bezel);
      border-radius: var(--phone-outer-radius);
      background:
        linear-gradient(145deg, rgba(255,255,255,.2), transparent 17%),
        linear-gradient(160deg, #3f4146 0%, #202227 48%, #0b0c0f 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.13),
        inset 0 0 0 2px rgba(0,0,0,.85),
        0 32px 68px -20px rgba(10,12,16,.52),
        0 10px 24px -10px rgba(10,12,16,.32);
      isolation: isolate;
    }

    .phone-frame::before,
    .phone-frame::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: 96px;
      bottom: 96px;
      width: 2px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,.13) 16%, transparent 30%, transparent 72%, rgba(255,255,255,.07) 88%, transparent);
    }
    .phone-frame::before { left: 0; }
    .phone-frame::after { right: 0; }

    .hardware-button {
      position: absolute;
      width: 4px;
      border-radius: 3px;
      background: linear-gradient(90deg, #08090b, #2a2d33 60%, #08090b);
      box-shadow: inset 0 1px rgba(255,255,255,.08);
    }
    .hardware-button.volume { left: -3px; top: 222px; height: 86px; }
    .hardware-button.power { right: -3px; top: 270px; height: 82px; }

    .phone-screen {
      position: relative;
      width: var(--phone-screen-width);
      height: var(--phone-screen-height);
      overflow: hidden;
      border-radius: var(--phone-screen-radius);
      background: var(--phone-screen-bg);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
    }

    .phone-content {
      position: absolute;
      inset: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-top: var(--phone-safe-top);
      padding-bottom: var(--phone-safe-bottom);
      background: var(--phone-screen-bg);
    }
    .phone-content::-webkit-scrollbar { display: none; }

    .camera-dot {
      position: absolute;
      z-index: 20;
      top: 13px;
      left: 50%;
      width: 10px;
      height: 10px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, #344154 0 12%, #0a0c10 34%, #000 76%);
      box-shadow: 0 0 0 1px rgba(255,255,255,.06);
      pointer-events: none;
    }

    .status-bar {
      position: absolute;
      z-index: 15;
      inset: 0 0 auto;
      height: var(--phone-safe-top);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 56px minmax(0, 1fr);
      align-items: start;
      padding: 14px 20px 0;
      color: var(--phone-system-fg);
      opacity: .8;
      pointer-events: none;
    }
    .status-time {
      justify-self: start;
      display: flex;
      align-items: center;
      height: 15px;
      font-size: 14px;
      font-weight: 560;
      line-height: 1;
      letter-spacing: .01em;
    }
    .status-cutout-zone { width: 56px; }
    .status-icons {
      justify-self: end;
      display: inline-flex;
      align-items: center;
      height: 15px;
      gap: 6px;
    }
    .status-icons svg {
      display: block;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .status-icons .connectivity { width: 15px; height: 12px; }
    .status-icons .wifi { width: 15px; height: 12px; }
    .status-icons .battery { width: 19px; height: 11px; }

    .gesture-indicator {
      position: absolute;
      z-index: 20;
      left: 50%;
      bottom: 8px;
      width: 96px;
      height: 4px;
      transform: translateX(-50%);
      border-radius: 99px;
      background: var(--phone-system-fg);
      opacity: .86;
      pointer-events: none;
    }

    /* Presentation scaling: keep the whole handset visible on short viewports. */
    @media (max-height: 927px) { .phone-frame { zoom: 0.9; } }
    @media (max-height: 840px) { .phone-frame { zoom: 0.82; } }
    @media (max-height: 771px) { .phone-frame { zoom: 0.74; } }
    @media (max-height: 702px) { .phone-frame { zoom: 0.66; } }
    /* Narrow viewports: the handset chrome collapses and the screen fills the
       viewport, so the app behaves like a real phone page instead of
       scrolling sideways. */
    @media (max-width: 480px) {
      body { padding: 0; display: block; }
      .phone-frame { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; zoom: 1; }
      .phone-frame::before, .phone-frame::after, .hardware-button { display: none; }
      .phone-screen { width: 100%; height: 100%; border-radius: 0; }
    }

    /* ---------- Product tokens (Artizo Sport · sideline direction) ---------- */
    :root {
      --c-ground: #F3F5F7;
      --c-surface: #FFFFFF;
      --c-ink: #0F1B2D;
      --c-ink-muted: #55627A;
      --c-hairline: #DDE2E9;
      --c-control-border: #7A8698;
      --c-track: #E4E8EE;
      --c-navy: #0F1B2D;
      --c-navy-raised: #22324D;
      --c-on-navy: #FFFFFF;
      --c-on-navy-muted: #B9C3D3;
      --c-copper: #B4472A;
      --c-copper-strong: #983A21;
      --c-copper-tint: #F8E9E4;
      --c-match: #0E7A4B;
      --c-match-tint: #E3F3EB;
      --c-pitch-line: rgba(255,255,255,.38);
      --c-on-pitch-muted: #D6F0E3;
      --c-practice: #2456C9;
      --c-practice-tint: #E6EDFB;
      --c-volt: #C8F23C;
      --c-live: #FF6B5E;
      --c-warning: #8A4B00;
      --c-warning-fill: #C97A0A;
      --c-warning-tint: #FDF1DC;
      --c-danger: #B3261E;
      --c-danger-tint: #FBE9E7;
      --c-focus: #2456C9;
      --c-scrim: rgba(15,27,45,.48);
      --c-logo-tile: #F6F4E7;
      --c-selected-bg: #0F1B2D;
      --c-selected-fg: #FFFFFF;
      --c-selected-muted: #B9C3D3;
      --c-copper-text: #B4472A;
      --c-copper-hover: #983A21;
      --c-pitch: #0E7A4B;
      --c-switch-on: #0E7A4B;
      --c-bar: #0F1B2D;
      --c-toast: #0F1B2D;
      --c-toast-btn: rgba(255,255,255,.14);
      --c-danger-solid: #B3261E;
      --c-navy-raised-hover: #2E4163;
      --c-on-navy-btn-bg: #FFFFFF;
      --c-on-navy-btn-fg: #0F1B2D;
      --c-on-volt: #0F1B2D;
      --c-drop: #C8F23C;

      --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
      --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --fs-13: 13px;
      --fs-14: 14px;
      --fs-16: 16px;
      --fs-18: 18px;
      --fs-22: 22px;
      --fs-28: 28px;
      --fs-40: 40px;
      --lh-body: 1.5;
      --lh-tight: 1.2;

      --s-1: 4px;
      --s-2: 8px;
      --s-3: 12px;
      --s-4: 16px;
      --s-6: 24px;
      --s-8: 32px;
      --s-12: 48px;

      --r-control: 12px;
      --r-card: 16px;
      --r-sheet: 24px;
      --r-pill: 999px;
      --touch: 44px;

      --shadow-raised: 0 -6px 24px rgba(15,27,45,.12);
      --shadow-bar: 0 -1px 0 var(--c-hairline);

      --t-small: 180ms;
      --t-enter: 300ms;
      --t-exit: 200ms;
      --ease-out: cubic-bezier(.2,.7,.3,1);
      --ease-in: cubic-bezier(.5,0,.9,.4);

      --phone-screen-bg: var(--c-ground);
      --phone-system-fg: var(--c-ink);
    }

    /* Dark theme: one token set, applied through data-theme on the root. */
    :root[data-theme="dark"] {
      color-scheme: dark;
      --c-ground: #0B1220;
      --c-surface: #151F30;
      --c-ink: #EEF2F7;
      --c-ink-muted: #A3AFC2;
      --c-hairline: #2A374B;
      --c-control-border: #6B7A91;
      --c-track: #2A374B;
      --c-navy: #1B2A42;
      --c-navy-raised: #2B3D5C;
      --c-navy-raised-hover: #364B70;
      --c-copper-strong: #F0916F;
      --c-copper-text: #F0916F;
      --c-copper-hover: #9E3D23;
      --c-copper-tint: #3A2019;
      --c-match: #4CC38A;
      --c-match-tint: #12301F;
      --c-pitch: #0E6A42;
      --c-switch-on: #2E9E6B;
      --c-practice: #7FA6FF;
      --c-practice-tint: #16264A;
      --c-warning: #F2B24A;
      --c-warning-fill: #F2B24A;
      --c-warning-tint: #3A2A0E;
      --c-danger: #FF8A80;
      --c-danger-solid: #C4372E;
      --c-danger-tint: #3D1714;
      --c-focus: #C8F23C;
      --c-scrim: rgba(0,0,0,.6);
      --c-selected-bg: #EEF2F7;
      --c-selected-fg: #0B1220;
      --c-selected-muted: #44536A;
      --c-bar: #C9D3E2;
      --c-toast: #2B3D5C;
      --shadow-raised: 0 -6px 24px rgba(0,0,0,.5);
      --phone-stage-bg: #05080F;
    }
    :root[data-theme="dark"] body { background: var(--phone-stage-bg); }

    /* Embedded presentation (board.html): no stage, handset at full size. */
    :root.is-embed body, :root.is-embed[data-theme] body { padding: 0; background: transparent; }
    :root.is-embed .phone-frame { zoom: 1; }

    [hidden] { display: none !important; }
    .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

    /* The app owns its own bars: the tab bar reserves the bottom safe area. */
    .phone-content { padding-bottom: 0; overflow: hidden; }

    .app {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      height: 100%;
      font-family: var(--font-body);
      font-size: var(--fs-16);
      line-height: var(--lh-body);
      color: var(--c-ink);
      background: var(--c-ground);
      -webkit-font-smoothing: antialiased;
    }
    .app h1, .app h2, .app h3, .app p, .app ul { margin: 0; }
    .app ul { padding: 0; list-style: none; }
    .app button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
    .app button:disabled { cursor: not-allowed; opacity: .5; }
    .app a { color: inherit; text-decoration: none; }
    .app :focus-visible, .sheet :focus-visible, .toast :focus-visible { outline: 3px solid var(--c-focus); outline-offset: 2px; }
    .on-navy :focus-visible, .toast :focus-visible { outline-color: var(--c-volt); }
    .app h2:focus, .sheet h2:focus { outline: none; }

    .screens { min-height: 0; }
    .screen { height: 100%; }
    .screen-bar { padding: var(--s-2) var(--s-4) var(--s-3); display: grid; gap: var(--s-3); }
    .screen-bar h1 { font-family: var(--font-display); font-size: var(--fs-28); line-height: 1.15; font-weight: 700; letter-spacing: -.01em; }
    .screen-kicker { font-size: var(--fs-14); color: var(--c-ink-muted); font-weight: 500; }
    .screen-body { display: flex; flex-direction: column; gap: var(--s-6); padding-block: var(--s-1) var(--s-6); scrollbar-width: none; }
    .screen-body::-webkit-scrollbar { display: none; }
    .screen-body > * { flex: none; }
    .screen-body > :not(.od-rail) { margin-inline: var(--s-4); }
    .screen.is-entering .screen-body { animation: screen-in 200ms var(--ease-out); }
    @keyframes screen-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .section { display: grid; gap: var(--s-3); }
    .section-head h2, .section > h2 { font-family: var(--font-display); font-size: var(--fs-18); line-height: var(--lh-tight); font-weight: 650; }
    .muted { color: var(--c-ink-muted); }
    .small { font-size: var(--fs-14); }

    .icon { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .icon-sm { width: 16px; height: 16px; stroke-width: 2; }

    .card { background: var(--c-surface); border: 1px solid var(--c-hairline); border-radius: var(--r-card); padding: var(--s-4); }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2); min-height: var(--touch); padding: 0 var(--s-4); border-radius: var(--r-control); font-weight: 600; font-size: var(--fs-16); white-space: nowrap; transition: transform var(--t-small) var(--ease-out); }
    .app .btn, .sheet .btn { padding: 0 var(--s-4); }
    .btn:active { transform: scale(.97); }
    .btn-primary, .app .btn-primary, .sheet .btn-primary { background: var(--c-copper); color: #fff; }
    .btn-secondary, .app .btn-secondary, .sheet .btn-secondary { background: var(--c-surface); color: var(--c-ink); border: 1px solid var(--c-control-border); }
    .btn-volt, .app .btn-volt { background: var(--c-volt); color: var(--c-on-volt); }
    .btn-on-navy, .app .btn-on-navy { background: var(--c-on-navy-btn-bg); color: var(--c-on-navy-btn-fg); }
    .btn-navy-raised, .app .btn-navy-raised { background: var(--c-navy-raised); color: var(--c-on-navy); }
    .btn-danger, .sheet .btn-danger { background: var(--c-surface); color: var(--c-danger); border: 1px solid var(--c-danger); }
    .btn-danger-solid, .sheet .btn-danger-solid { background: var(--c-danger-solid); color: #fff; }
    .btn-block { display: flex; width: 100%; }
    .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: var(--touch); height: var(--touch); border-radius: var(--r-control); color: var(--c-ink); }
    .icon-btn.is-outlined, .app .icon-btn.is-outlined, .sheet .icon-btn.is-outlined { border: 1px solid var(--c-control-border); background: var(--c-surface); }
    .link { display: inline-flex; align-items: center; min-height: var(--touch); color: var(--c-copper-text); font-weight: 600; font-size: var(--fs-14); text-decoration: underline; text-underline-offset: 3px; }
    .app a.link { color: var(--c-copper-text); text-decoration: underline; }

    /* Team switcher */
    .team-chip { min-height: 56px; padding: var(--s-2) var(--s-4); border-radius: var(--r-control); background: var(--c-surface); border: 1px solid var(--c-hairline); align-content: center; transition: transform var(--t-small) var(--ease-out); }
    .app .team-chip { padding: var(--s-2) var(--s-4); background: var(--c-surface); border: 1px solid var(--c-hairline); }
    .team-chip-name { font-weight: 600; font-size: var(--fs-16); line-height: var(--lh-tight); white-space: nowrap; }
    .team-chip-meta { font-size: var(--fs-13); color: var(--c-ink-muted); white-space: nowrap; }
    .app .team-chip[aria-pressed="true"] { background: var(--c-selected-bg); border-color: var(--c-selected-bg); color: var(--c-selected-fg); }
    .team-chip[aria-pressed="true"] .team-chip-meta { color: var(--c-selected-muted); }

    .chip { display: inline-flex; align-items: center; min-height: var(--touch); padding: 0 var(--s-4); border-radius: var(--r-pill); font-size: var(--fs-14); font-weight: 600; white-space: nowrap; }
    .app .chip { padding: 0 var(--s-4); background: var(--c-surface); border: 1px solid var(--c-hairline); }
    .app .chip[aria-pressed="true"] { background: var(--c-selected-bg); border-color: var(--c-selected-bg); color: var(--c-selected-fg); }

    .seg { display: flex; gap: var(--s-1); padding: var(--s-1); border-radius: var(--r-control); background: var(--c-track); }
    .seg button { flex: 1 1 0; min-height: var(--touch); border-radius: var(--s-2); font-size: var(--fs-14); font-weight: 500; color: var(--c-ink-muted); text-align: center; }
    .app .seg button { text-align: center; color: var(--c-ink-muted); padding: 0 var(--s-3); }
    .app .seg button[aria-pressed="true"] { background: var(--c-surface); color: var(--c-ink); font-weight: 700; box-shadow: 0 1px 2px rgba(15,27,45,.16); }
    .seg-compact { flex: none; }

    /* Hero */
    .hero { display: grid; gap: var(--s-3); padding: var(--s-4); border-radius: var(--r-card); background: var(--c-navy); color: var(--c-on-navy); }
    .hero-label { font-size: var(--fs-13); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--c-on-navy-muted); }
    .hero-title { font-family: var(--font-display); font-size: var(--fs-22); line-height: var(--lh-tight); font-weight: 700; }
    .hero-meta { font-size: var(--fs-14); color: var(--c-on-navy-muted); }
    .hero-clock { font-family: var(--font-display); font-size: var(--fs-22); font-weight: 700; color: var(--c-volt); font-variant-numeric: tabular-nums; }
    .hero-score { --od-gap: 12px; }
    .hero-team { font-weight: 600; line-height: var(--lh-tight); }
    .hero-team.is-right { text-align: right; }
    .hero-num { font-family: var(--font-display); font-size: var(--fs-40); line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
    .live-pill { display: inline-flex; align-items: center; gap: var(--s-2); font-size: var(--fs-14); font-weight: 600; }
    .live-dot { display: block; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c-live); }
    .is-running .live-dot { animation: pulse 1600ms ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }

    /* Week strip */
    .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--s-1); }
    .day { min-height: 72px; padding: var(--s-2) 0; border-radius: var(--r-control); justify-items: center; align-content: center; text-align: center; }
    .app .day { background: var(--c-surface); border: 1px solid var(--c-hairline); text-align: center; padding: var(--s-2) 0; }
    .day-wd { font-size: var(--fs-13); color: var(--c-ink-muted); line-height: 1.2; }
    .day-num { font-family: var(--font-display); font-size: var(--fs-18); font-weight: 650; line-height: 1.2; }
    .day-marks { display: flex; gap: 2px; justify-content: center; align-items: center; min-height: 16px; }
    .day-marks .is-match { color: var(--c-match); }
    .day-marks .is-practice { color: var(--c-practice); }
    .app .day.is-today { border: 2px solid var(--c-copper-text); }
    .app .day[aria-pressed="true"] { background: var(--c-selected-bg); border-color: var(--c-selected-bg); color: var(--c-selected-fg); }
    .day[aria-pressed="true"] .day-wd { color: var(--c-selected-muted); }
    .day[aria-pressed="true"] .day-marks span { color: var(--c-selected-fg); }
    .week-nav-label { font-weight: 600; text-align: center; }

    /* Event rows */
    .event-list { display: grid; gap: var(--s-2); }
    .event-row { width: 100%; --od-gap: 12px; padding: var(--s-3); border-radius: var(--r-card); min-height: 72px; }
    .app .event-row { background: var(--c-surface); border: 1px solid var(--c-hairline); padding: var(--s-3); }
    .datecell { width: 48px; padding: var(--s-2) 0; border-radius: var(--r-control); background: var(--c-ground); text-align: center; }
    .dc-mo { font-size: var(--fs-13); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--c-ink-muted); line-height: 1.2; }
    .dc-d { font-family: var(--font-display); font-size: var(--fs-22); font-weight: 700; line-height: 1.1; }
    .ev-tag { display: flex; align-items: center; gap: var(--s-1); font-size: var(--fs-13); font-weight: 600; line-height: 1.3; }
    .od-field > .ev-tag, .hero > .ev-tag { display: flex; }
    .ev-tag.is-match { color: var(--c-match); }
    .ev-tag.is-practice { color: var(--c-practice); }
    .ev-tag.is-live { color: var(--c-danger); gap: var(--s-2); }
    .ev-tag.is-live .live-dot { background: var(--c-danger); }
    .ev-title { font-weight: 600; line-height: 1.3; }
    .ev-meta { font-size: var(--fs-14); color: var(--c-ink-muted); }
    .chev { color: var(--c-ink-muted); width: 20px; height: 20px; }
    .day-head { font-family: var(--font-display); font-size: var(--fs-16); font-weight: 650; }
    .day-head-today { font-family: var(--font-body); font-size: var(--fs-13); font-weight: 600; color: var(--c-copper-text); }

    /* Empty state */
    .empty { display: grid; gap: var(--s-3); justify-items: start; padding: var(--s-6) var(--s-4); border-radius: var(--r-card); background: var(--c-surface); border: 1px dashed var(--c-control-border); }
    .empty h2, .empty h3 { font-family: var(--font-display); font-size: var(--fs-18); font-weight: 650; line-height: var(--lh-tight); }
    .empty-actions { --od-gap: 8px; }

    /* Stats */
    .stat { padding: var(--s-3); border-radius: var(--r-control); background: var(--c-surface); border: 1px solid var(--c-hairline); }
    .stat-num { font-family: var(--font-display); font-size: var(--fs-22); font-weight: 700; line-height: 1.15; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .stat-cap { font-size: var(--fs-13); color: var(--c-ink-muted); line-height: 1.3; }

    /* Gameday */
    .scorebar { margin: 0 var(--s-4) var(--s-3); padding: var(--s-3) var(--s-4) var(--s-4); border-radius: var(--r-card); background: var(--c-navy); color: var(--c-on-navy); display: grid; gap: var(--s-3); }
    .sb-meta { font-size: var(--fs-13); color: var(--c-on-navy-muted); }
    .sb-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: var(--s-3); align-items: start; }
    .sb-team { --od-gap: 4px; justify-items: start; }
    .sb-team.is-right { justify-items: end; text-align: right; }
    .sb-name { font-size: var(--fs-14); font-weight: 600; line-height: 1.25; min-height: calc(2 * 1.25em); }
    .sb-score { font-family: var(--font-display); font-size: var(--fs-40); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .sb-clock { display: grid; gap: var(--s-1); justify-items: center; }
    .clock { display: block; min-width: 5ch; text-align: center; font-family: var(--font-display); font-size: var(--fs-40); font-weight: 700; line-height: 1; color: var(--c-volt); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .clock-btn { display: grid; place-items: center; width: var(--touch); height: var(--touch); border-radius: 50%; }
    .app .clock-btn { background: var(--c-volt); color: var(--c-navy); }
    .clock-state { display: block; font-size: var(--fs-13); color: var(--c-on-navy-muted); white-space: nowrap; }
    .app .goal-btn { font-size: var(--fs-14); padding: 0 var(--s-3); gap: var(--s-1); }

    .fair { display: grid; gap: var(--s-3); }
    .fair h2 { font-family: var(--font-display); font-size: var(--fs-18); font-weight: 650; line-height: var(--lh-tight); }
    .suggest { --od-gap: 12px; padding: var(--s-3); border-radius: var(--r-control); background: var(--c-copper-tint); }
    .suggest-label { font-size: var(--fs-13); font-weight: 600; color: var(--c-copper-strong); }
    .suggest-text { font-weight: 600; line-height: 1.3; }
    .balanced { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-3); border-radius: var(--r-control); background: var(--c-match-tint); color: var(--c-match); font-weight: 600; font-size: var(--fs-14); }

    .pitch { position: relative; display: grid; gap: var(--s-3); padding: var(--s-6) var(--s-3) var(--s-4); border-radius: var(--r-card); background: var(--c-pitch); color: #fff; }
    .pitch-lines { position: absolute; inset: 8px; border: 2px solid var(--c-pitch-line); border-radius: 8px; pointer-events: none; }
    .pitch-arc { position: absolute; top: 8px; left: 50%; width: 96px; height: 48px; transform: translateX(-50%); border: 2px solid var(--c-pitch-line); border-top: 0; border-radius: 0 0 48px 48px; pointer-events: none; }
    .pitch-box { position: absolute; bottom: 8px; left: 50%; width: 56%; height: 92px; transform: translateX(-50%); border: 2px solid var(--c-pitch-line); border-bottom: 0; pointer-events: none; }
    .pitch-row { position: relative; display: flex; justify-content: space-around; }
    .token { width: 96px; padding: var(--s-1); border-radius: var(--r-control); justify-items: center; text-align: center; --od-gap: 2px; }
    .app .token { text-align: center; color: #fff; padding: var(--s-1); }
    .token-num { display: grid; place-items: center; width: var(--touch); height: var(--touch); border-radius: 50%; background: #fff; color: var(--c-navy); font-family: var(--font-display); font-size: var(--fs-18); font-weight: 700; transition: transform var(--t-small) var(--ease-out); }
    .token.is-rest .token-num { box-shadow: 0 0 0 3px var(--c-volt); }
    .token-name { font-size: var(--fs-14); font-weight: 600; line-height: 1.25; }
    .token-min { font-size: var(--fs-13); color: var(--c-on-pitch-muted); line-height: 1.25; }
    .pitch :focus-visible { outline-color: var(--c-volt); }

    .player-list { display: grid; gap: var(--s-2); }
    .prow { --od-gap: 12px; padding: var(--s-3); border-radius: var(--r-card); background: var(--c-surface); border: 1px solid var(--c-hairline); }
    .prow-num { width: 28px; font-family: var(--font-display); font-size: var(--fs-18); font-weight: 700; text-align: center; }
    .prow-body { --od-gap: 4px; }
    .prow-name { font-weight: 600; line-height: 1.3; }
    .prow-pos { font-weight: 400; color: var(--c-ink-muted); font-size: var(--fs-14); }
    .prow-min { font-size: var(--fs-14); font-weight: 600; font-variant-numeric: tabular-nums; }
    .bar { display: block; height: 8px; border-radius: var(--r-pill); background: var(--c-track); overflow: hidden; }
    .bar-fill { display: block; height: 100%; border-radius: var(--r-pill); background: var(--c-bar); transform-origin: left center; transition: transform var(--t-enter) var(--ease-out); }
    .bar.is-due .bar-fill, .bar.is-rest .bar-fill { background: var(--c-warning-fill); }
    .pstatus { display: flex; align-items: center; gap: var(--s-1); font-size: var(--fs-13); font-weight: 600; color: var(--c-ink-muted); line-height: 1.3; }
    .od-field > .pstatus { display: flex; }
    .pstatus.is-due, .pstatus.is-rest { color: var(--c-warning); }
    .pstatus.is-ok { color: var(--c-match); }
    .pstatus.is-out { color: var(--c-danger); }
    .app .btn-sm, .sheet .btn-sm { font-size: var(--fs-14); padding: 0 var(--s-3); }

    /* Practice */
    .next-practice { display: grid; gap: var(--s-1); }
    .block-list { display: grid; gap: var(--s-2); }
    .block { --od-gap: 8px; padding: var(--s-2) var(--s-2) var(--s-2) var(--s-3); border-radius: var(--r-card); background: var(--c-surface); border: 1px solid var(--c-hairline); }
    .block-time { width: 56px; --od-gap: 0px; }
    .block-start { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-16); font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1.3; }
    .block-dur { font-size: var(--fs-13); color: var(--c-ink-muted); white-space: nowrap; line-height: 1.3; }
    .block-body { min-height: var(--touch); align-content: center; border-radius: var(--s-2); --od-gap: 0px; }
    .block-cat { font-size: var(--fs-13); font-weight: 600; color: var(--c-ink-muted); line-height: 1.3; }
    .block-title { font-weight: 600; line-height: 1.3; }
    .plan-status { font-size: var(--fs-14); font-weight: 600; }
    .plan-status.is-ok { color: var(--c-match); }
    .plan-status.is-off { color: var(--c-warning); }

    /* Team */
    .roster-row { width: 100%; --od-gap: 12px; padding: var(--s-3); border-radius: var(--r-card); min-height: 64px; }
    .app .roster-row { background: var(--c-surface); border: 1px solid var(--c-hairline); padding: var(--s-3); }
    .jersey { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--c-navy-raised); color: var(--c-on-navy); font-family: var(--font-display); font-weight: 700; font-size: var(--fs-16); }
    .jersey.is-lg { width: 56px; height: 56px; font-size: var(--fs-22); }
    .brand-foot { display: grid; gap: var(--s-2); justify-items: center; padding: var(--s-4) 0 0; text-align: center; }
    .brand-tile { width: 148px; padding: var(--s-3); border-radius: var(--r-card); background: var(--c-logo-tile); }

    /* Tab bar */
    .tabbar { display: flex; padding: var(--s-1) var(--s-2) var(--phone-safe-bottom); background: var(--c-surface); box-shadow: var(--shadow-bar); }
    .tabbar a { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; border-radius: var(--r-control); color: var(--c-ink-muted); }
    .app .tabbar a { color: var(--c-ink-muted); }
    .tab-icon { position: relative; display: block; height: 24px; }
    .tab-label { font-size: var(--fs-13); font-weight: 500; line-height: 1.2; }
    .app .tabbar a[aria-current="page"] { color: var(--c-copper-text); background: var(--c-copper-tint); }
    .tabbar a[aria-current="page"] .tab-label { font-weight: 700; }
    .tab-live { position: absolute; top: -2px; right: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--c-danger); border: 2px solid var(--c-surface); }
    .tabbar a[aria-current="page"] .tab-live { border-color: var(--c-copper-tint); }

    /* Sheets and toast (mounted in the handset screen) */
    .sheet-layer { position: absolute; inset: 0; z-index: 12; display: flex; flex-direction: column; justify-content: flex-end; font-family: var(--font-body); font-size: var(--fs-16); line-height: var(--lh-body); color: var(--c-ink); }
    .scrim { position: absolute; inset: 0; background: var(--c-scrim); opacity: 0; transition: opacity var(--t-exit) var(--ease-in); }
    .sheet { position: relative; max-height: 84%; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; display: grid; gap: var(--s-4); padding: var(--s-4) var(--s-4) calc(var(--phone-safe-bottom) + var(--s-4)); border-radius: var(--r-sheet) var(--r-sheet) 0 0; background: var(--c-surface); box-shadow: var(--shadow-raised); transform: translateY(100%); transition: transform var(--t-exit) var(--ease-in); }
    .sheet::-webkit-scrollbar { display: none; }
    .sheet-layer.is-open .scrim { opacity: 1; transition: opacity var(--t-enter) var(--ease-out); }
    .sheet-layer.is-open .sheet { transform: none; transition: transform var(--t-enter) var(--ease-out); }
    .sheet h2, .sheet h3, .sheet p, .sheet ul { margin: 0; }
    .sheet button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
    .sheet button:disabled { cursor: not-allowed; opacity: .5; }
    .sheet a { text-decoration: none; }
    .sheet h2 { font-family: var(--font-display); font-size: var(--fs-22); font-weight: 700; line-height: var(--lh-tight); }
    .sheet h3 { font-size: var(--fs-14); font-weight: 700; }
    .sheet-head { --od-gap: 12px; }
    .sheet-actions { display: grid; gap: var(--s-2); }
    .sheet-actions.is-pair { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .detail-row { --od-gap: 12px; }
    .detail-row .icon { margin-top: 2px; color: var(--c-ink-muted); }
    .detail-main { font-weight: 600; line-height: 1.35; }
    .pick-list { display: grid; gap: var(--s-2); padding: 0; list-style: none; }
    .pick { width: 100%; --od-gap: 12px; min-height: 60px; padding: var(--s-2) var(--s-3); border-radius: var(--r-control); }
    .sheet .pick { border: 1px solid var(--c-hairline); padding: var(--s-2) var(--s-3); }
    .pick-badge { font-size: var(--fs-13); font-weight: 600; color: var(--c-copper-strong); background: var(--c-copper-tint); padding: 2px var(--s-2); border-radius: var(--r-pill); white-space: nowrap; }
    .points { display: grid; gap: var(--s-1); padding-left: var(--s-4); list-style: disc; }
    .sheet ul.points { padding-left: 20px; list-style: disc; }
    .stepper { --od-gap: 12px; }
    .stepper-val { min-width: 72px; text-align: center; font-family: var(--font-display); font-size: var(--fs-22); font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .confirm { display: grid; gap: var(--s-3); padding: var(--s-3); border-radius: var(--r-control); background: var(--c-danger-tint); }

    .switch-row { --od-gap: 12px; padding: var(--s-3); border-radius: var(--r-control); border: 1px solid var(--c-hairline); }
    .switch { position: relative; display: block; width: 52px; height: 32px; border-radius: var(--r-pill); background: var(--c-control-border); transition: background-color var(--t-small) var(--ease-out); }
    .sheet .switch { background: var(--c-control-border); }
    .switch-knob { position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform var(--t-small) var(--ease-out); }
    .sheet .switch[aria-checked="true"] { background: var(--c-switch-on); }
    .switch[aria-checked="true"] .switch-knob { transform: translateX(20px); }
    .switch-tap { display: grid; place-items: center; min-width: 52px; min-height: var(--touch); }

    /* Forms */
    .form { display: grid; gap: var(--s-4); }
    .field { display: grid; gap: var(--s-1); }
    .field label, .field legend { font-size: var(--fs-14); font-weight: 600; padding: 0; }
    .req { font-weight: 400; color: var(--c-ink-muted); }
    .field input, .field select { width: 100%; min-height: 48px; padding: 0 var(--s-3); border-radius: var(--r-control); border: 1px solid var(--c-control-border); background: var(--c-surface); color: var(--c-ink); font: inherit; font-size: var(--fs-16); }
    .field input[aria-invalid="true"] { border: 2px solid var(--c-danger); }
    .field-err { display: flex; gap: var(--s-1); align-items: flex-start; font-size: var(--fs-14); color: var(--c-danger); font-weight: 500; }
    .field-err .icon { margin-top: 2px; }
    .field-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-3); }
    fieldset.field { border: 0; margin: 0; padding: 0; min-width: 0; }
    .radio-seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-2); }
    .radio-seg label { display: flex; align-items: center; gap: var(--s-2); min-height: 48px; padding: 0 var(--s-3); border-radius: var(--r-control); border: 1px solid var(--c-control-border); font-size: var(--fs-16); font-weight: 500; cursor: pointer; }
    .radio-seg input { width: 20px; min-height: 0; height: 20px; margin: 0; accent-color: var(--c-copper); }
    .radio-seg label:has(input:checked) { border: 2px solid var(--c-ink); font-weight: 600; }
    .err-summary { display: grid; gap: var(--s-1); padding: var(--s-3); border-radius: var(--r-control); background: var(--c-danger-tint); color: var(--c-danger); font-size: var(--fs-14); }
    .err-summary strong { font-weight: 700; }
    .sheet .err-link { min-height: var(--touch); display: flex; align-items: center; text-decoration: underline; text-underline-offset: 3px; color: var(--c-danger); font-weight: 600; }

    .toast { position: absolute; z-index: 14; left: var(--s-4); right: var(--s-4); bottom: calc(var(--phone-safe-bottom) + 72px); display: flex; align-items: center; gap: var(--s-3); padding: var(--s-2) var(--s-2) var(--s-2) var(--s-4); min-height: 52px; border-radius: var(--r-control); background: var(--c-toast); color: var(--c-on-navy); font-family: var(--font-body); font-size: var(--fs-14); font-weight: 500; line-height: 1.35; box-shadow: 0 8px 24px rgba(15,27,45,.28); animation: toast-in 240ms var(--ease-out); }
    .toast-msg { flex: 1 1 0; min-width: 0; padding-block: var(--s-1); }
    .toast button { flex: none; min-height: var(--touch); padding: 0 var(--s-3); border: 0; border-radius: var(--s-2); background: var(--c-toast-btn); color: var(--c-volt); font: inherit; font-weight: 700; cursor: pointer; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    /* Lineup builder (pre-match) */
    .screen-foot { padding: var(--s-3) var(--s-4); background: var(--c-ground); box-shadow: var(--shadow-bar); }
    .slot { width: 96px; border-radius: var(--r-control); justify-items: center; --od-gap: 2px; transition: transform var(--t-small) var(--ease-out); }
    .app .slot { padding: var(--s-1); color: #fff; text-align: center; }
    .slot .token-num, .slot-ring { width: 56px; height: 56px; font-size: var(--fs-22); }
    .slot-ring { display: grid; place-items: center; border-radius: 50%; border: 2px dashed rgba(255,255,255,.75); }
    .slot[aria-pressed="true"] .token-num, .slot.is-drop .token-num, .slot.is-drop .slot-ring { box-shadow: 0 0 0 4px var(--c-drop); }
    .slot.is-drop { transform: scale(1.06); }
    .bench-tray { display: grid; gap: var(--s-2); padding: var(--s-2); border-radius: var(--r-card); border: 1px dashed var(--c-control-border); }
    .bench-tray.is-drop { outline: 2px dashed var(--c-copper-text); outline-offset: -1px; background: var(--c-copper-tint); }

  (function () {

    /* ---------- helpers ---------- */
    const $ = (s, r) => (r || document).querySelector(s);
    const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const icon = (n, cls) => '<svg class="icon ' + (cls || '') + '" aria-hidden="true" focusable="false"><use href="#i-' + n + '"/></svg>';
    const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);

    const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const WDL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const toDate = iso => { const p = iso.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
    const pad = n => String(n).padStart(2, '0');
    const toISO = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    const addDays = (iso, n) => { const d = toDate(iso); d.setDate(d.getDate() + n); return toISO(d); };
    const weekStart = iso => addDays(iso, -((toDate(iso).getDay() + 6) % 7));
    const fmtDay = iso => { const d = toDate(iso); return WD[d.getDay()] + ', ' + MO[d.getMonth()] + ' ' + d.getDate(); };
    const fmtShort = iso => { const d = toDate(iso); return MO[d.getMonth()] + ' ' + d.getDate(); };
    const fmtTime = t => { if (!t) return ''; const p = t.split(':').map(Number); const ap = p[0] >= 12 ? 'PM' : 'AM'; return (p[0] % 12 || 12) + ':' + pad(p[1]) + ' ' + ap; };
    const addMin = (t, m) => { const p = t.split(':').map(Number); const total = p[0] * 60 + p[1] + m; return pad(Math.floor(total / 60) % 24) + ':' + pad(total % 60); };

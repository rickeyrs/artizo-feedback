<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Artizo Sport — coach app prototype</title>
  <script>
    (function () {
      var d = document.documentElement, q = new URLSearchParams(location.search), t = q.get('theme'), saved = null;
      try { saved = localStorage.getItem('artizo-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark' && t !== 'contrast') t = (saved === 'light' || saved === 'dark' || saved === 'contrast') ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      d.dataset.theme = t === 'dark' ? 'dark' : (t === 'contrast' ? 'outdoor' : 'indoor');
      if (q.get('embed') === '1') d.classList.add('is-embed');
      var pal = q.get('palette');
      if (pal === 'pitch' || pal === 'navy' || pal === 'ember' || pal === 'cream' || pal === 'blend') d.dataset.palette = pal;
      // The app's own look is the design system (G, final direction). palette=ds shows the earlier cream system (B) for comparison.
      if (!pal) { d.dataset.palette = 'blend'; d.dataset.hero = 'black'; d.dataset.accent = 'green'; }
      if (q.get('layout') === 'pdf') d.dataset.layout = 'pdf';
      var acc = q.get('accent');
      if (acc && ['original','oranje','kit','bright','yellowcard','green','mint','red','blue'].indexOf(acc) >= 0) d.dataset.accent = acc;
      var hero = q.get('hero');
      if (hero && hero === 'charcoal' || hero === 'black') d.dataset.hero = hero;
    })();
  </script>
  <style>
    /* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
       Put this @layer first; product CSS outside the layer always wins. */
    @layer od-layout {
      :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }

      /* containers */
      .od-stack   { display: flex; flex-direction: column; gap: var(--od-gap, 8px); }
      .od-row     { display: flex; align-items: center; gap: var(--od-gap, 8px); }
      .od-row-top { display: flex; align-items: flex-start; gap: var(--od-gap, 8px); }
      .od-cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--od-gap, 8px); }
      .od-fill    { flex: 1 1 0; min-width: 0; }
      .od-fixed   { flex: none; }
      .od-grid    { display: grid; gap: var(--od-gap, 12px); grid-template-columns: repeat(var(--od-cols, 3), minmax(0, 1fr)); }

      /* stacked information: each piece is its own line — never sibling inline spans */
      .od-stat, .od-field, .od-cell { display: grid; gap: var(--od-gap, 2px); }
      :where(.od-stat,.od-field,.od-cell) > :where(*) { display: block; }
      .od-tile { display: grid; grid-template-rows: auto 1fr; }
      :where(.od-tile) > :where(*) { display: block; }

      /* media keeps its intrinsic ratio by default; never a distorted or cropped
         cover by accident. height:auto lets the ratio win over an <img height="…">
         attribute. Cropping to a uniform box is an explicit opt-in: set --od-ratio
         AND add .od-media-cover together (per the core rule, only where a crop is
         deliberate — tile thumbs, decorative fills — never on full-frame content). */
      .od-media { display: block; width: 100%; height: auto; aspect-ratio: var(--od-ratio, auto); }
      .od-media-cover { object-fit: cover; }

      /* data text only — authored copy is rewritten to its budget instead */
      .od-truncate { display: block; max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .od-clamp-2, .od-clamp-3 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
      .od-clamp-2 { -webkit-line-clamp: 2; }
      .od-clamp-3 { -webkit-line-clamp: 3; }
      .od-lines-2 { min-height: calc(2 * 1.4em); }   /* block-level reservation for a shared baseline */
      .od-nowrap  { white-space: nowrap; }           /* 数字+单位 · 价格+起 · 日期+星期 */
      .od-keep    { word-break: keep-all; overflow-wrap: anywhere; } /* CJK labels break at spaces / <wbr> first */

      /* screen skeleton (optional): bars take their own space, the middle scrolls — no padding guessed for chrome */
      .od-screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
      .od-scroll { overflow-y: auto; overscroll-behavior: contain; min-height: 0; }

      /* horizontal rail: the next item peeks at the edge; trailing room survives overflow */
      .od-rail { display: flex; gap: var(--od-gap, 8px); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
                 padding-inline: var(--od-rail-pad, 16px); scroll-padding-inline: var(--od-rail-pad, 16px); }
      .od-rail::-webkit-scrollbar { display: none; }
      :where(.od-rail) > :where(*) { flex: none; scroll-snap-align: start; }
      :where(.od-rail) > :where(:last-child) { margin-inline-end: var(--od-rail-pad, 16px); }

      .od-spacer { flex: none; visibility: hidden; pointer-events: none; }
      .od-touch  { min-width: 44px; min-height: 44px; }
    }
    /* /OD-LAYOUT-PRIMITIVES v1 */

    @font-face { font-family: "Newsreader"; src: url("Newsreader-500.ttf") format("truetype"); font-weight: 500; font-style: normal; font-display: swap; }
    @font-face { font-family: "Newsreader"; src: url("Newsreader-600.ttf") format("truetype"); font-weight: 600; font-style: normal; font-display: swap; }
    @font-face { font-family: "Newsreader"; src: url("Newsreader-700.ttf") format("truetype"); font-weight: 700; font-style: normal; font-display: swap; }
    @font-face { font-family: "Archivo Var"; src: url("assets/fonts/archivo-var-latin.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-style: normal; font-display: swap; }
    @font-face { font-family: "Source Sans 3"; src: url("SourceSans3-400.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Source Sans 3"; src: url("SourceSans3-600.ttf") format("truetype"); font-weight: 600; font-style: normal; font-display: swap; }
    @font-face { font-family: "Source Sans 3"; src: url("SourceSans3-700.ttf") format("truetype"); font-weight: 700; font-style: normal; font-display: swap; }
    @font-face { font-family: "Source Sans 3"; src: url("SourceSans3-800.ttf") format("truetype"); font-weight: 800; font-style: normal; font-display: swap; }

    /* ---------- Handset shell (Open Design neutral shell, kept intact) ---------- */
    :root {
      --phone-screen-width: 390px;
      --phone-screen-height: 844px;
      --phone-bezel: 10px;
      --phone-outer-radius: 52px;
      --phone-screen-radius: 42px;
      --phone-safe-top: 50px;
      --phone-safe-bottom: 29px;
      --phone-system-fg: #17181a;
      --phone-screen-bg: #f8f8f9;
      --phone-stage-bg: #eaebee;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        radial-gradient(circle at 50% 15%, rgba(255,255,255,.94), transparent 35%),
        var(--phone-stage-bg);
      color: #191a1d;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .phone-frame {
      position: relative;
      width: calc(var(--phone-screen-width) + var(--phone-bezel) * 2);
      height: calc(var(--phone-screen-height) + var(--phone-bezel) * 2);
      padding: var(--phone-bezel);
      border-radius: var(--phone-outer-radius);
      background:
        linear-gradient(145deg, rgba(255,255,255,.2), transparent 17%),
        linear-gradient(160deg, #3f4146 0%, #202227 48%, #0b0c0f 100%);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.13),
        inset 0 0 0 2px rgba(0,0,0,.85),
        0 32px 68px -20px rgba(10,12,16,.52),
        0 10px 24px -10px rgba(10,12,16,.32);
      isolation: isolate;
    }

    .phone-frame::before,
    .phone-frame::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: 96px;
      bottom: 96px;
      width: 2px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,.13) 16%, transparent 30%, transparent 72%, rgba(255,255,255,.07) 88%, transparent);
    }
    .phone-frame::before { left: 0; }
    .phone-frame::after { right: 0; }

    .hardware-button {
      position: absolute;
      width: 4px;
      border-radius: 3px;
      background: linear-gradient(90deg, #08090b, #2a2d33 60%, #08090b);
      box-shadow: inset 0 1px rgba(255,255,255,.08);
    }
    .hardware-button.volume { left: -3px; top: 222px; height: 86px; }
    .hardware-button.power { right: -3px; top: 270px; height: 82px; }

    .phone-screen {
      position: relative;
      width: var(--phone-screen-width);
      height: var(--phone-screen-height);
      overflow: hidden;
      border-radius: var(--phone-screen-radius);
      background: var(--phone-screen-bg);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05);
    }

    .phone-content {
      position: absolute;
      inset: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding-top: var(--phone-safe-top);
      padding-bottom: var(--phone-safe-bottom);
      background: var(--phone-screen-bg);
    }
    .phone-content::-webkit-scrollbar { display: none; }

    .camera-dot {
      position: absolute;
      z-index: 20;
      top: 13px;
      left: 50%;
      width: 10px;
      height: 10px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, #344154 0 12%, #0a0c10 34%, #000 76%);
      box-shadow: 0 0 0 1px rgba(255,255,255,.06);
      pointer-events: none;
    }

    .status-bar {
      position: absolute;
      z-index: 15;
      inset: 0 0 auto;
      height: var(--phone-safe-top);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 56px minmax(0, 1fr);
      align-items: start;
      padding: 14px 20px 0;
      color: var(--phone-system-fg);
      opacity: .8;
      pointer-events: none;
    }
    .status-time {
      justify-self: start;
      display: flex;
      align-items: center;
      height: 15px;
      font-size: 14px;
      font-weight: 560;
      line-height: 1;
      letter-spacing: .01em;
    }
    .status-cutout-zone { width: 56px; }
    .status-icons {
      justify-self: end;
      display: inline-flex;
      align-items: center;
      height: 15px;
      gap: 6px;
    }
    .status-icons svg {
      display: block;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.35;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .status-icons .connectivity { width: 15px; height: 12px; }
    .status-icons .wifi { width: 15px; height: 12px; }
    .status-icons .battery { width: 19px; height: 11px; }

    .gesture-indicator {
      position: absolute;
      z-index: 20;
      left: 50%;
      bottom: 8px;
      width: 96px;
      height: 4px;
      transform: translateX(-50%);
      border-radius: 99px;
      background: var(--phone-system-fg);
      opacity: .86;
      pointer-events: none;
    }

    /* Presentation scaling: keep the whole handset visible on short viewports. */
    @media (max-height: 927px) { .phone-frame { zoom: 0.9; } }
    @media (max-height: 840px) { .phone-frame { zoom: 0.82; } }
    @media (max-height: 771px) { .phone-frame { zoom: 0.74; } }
    @media (max-height: 702px) { .phone-frame { zoom: 0.66; } }
    /* Narrow viewports: the handset chrome collapses and the screen fills the
       viewport, so the app behaves like a real phone page instead of
       scrolling sideways. */
    @media (max-width: 480px) {
      body { padding: 0; display: block; }
      .phone-frame { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; zoom: 1; }
      .phone-frame::before, .phone-frame::after, .hardware-button { display: none; }
      .phone-screen { width: 100%; height: 100%; border-radius: 0; }
    }

    /* ---------- Artizo Sport design system tokens — copied verbatim from tokens.css ---------- */
    :root {
      --az-font-display: 'Newsreader', Georgia, serif;
      --az-font-ui: 'Source Sans 3', system-ui, sans-serif;

      --az-canvas: #F7F3E8; --az-surface: #FCFAF3; --az-border: #5E6976; --az-hairline: #DDD5C2;
      --az-text-primary: #242A33; --az-text-secondary: #3D4855; --az-text-muted: #666D79; --az-text-accent: #A03E1E;
      --az-action: #C24E28; --az-on-action: #FFFFFF;
      --az-selected: #242A33; --az-on-selected: #FCFAF3;
      --az-attention: #F5C64B; --az-on-attention: #242A33;
      --az-hero: #242A33; --az-on-hero: #FCFAF3; --az-on-hero-muted: #A8B2BD; --az-hero-tile: #2F3742; --az-hero-accent: #E28A61;
      --az-section-bar: #C24E28; --az-on-section-bar: #FFFFFF;
      --az-on-target: #017E4B; --az-urgent: #CC2F35; --az-on-danger: #FFFFFF;
      --az-event-match: #01D780; --az-event-practice: #2E9BFF;
      --az-status-start: #01D780; --az-status-bench: #FFD400; --az-status-out: #D92B33;
      --az-tray: #0F6FC4; --az-on-tray: #FCFAF3;
      --az-scrim: rgba(27, 32, 39, 0.55);
      --az-pitch-turf: #31693C; --az-pitch-turf-alt: #295C34; --az-pitch-line: #E8F0E4; --az-pitch-edge: #10141A;
      --az-on-pitch: #F4F8F2; --az-on-pitch-muted: #D3E5D0;

      --az-space-1: 4px; --az-space-2: 8px; --az-space-3: 12px; --az-space-4: 16px; --az-space-5: 20px;
      --az-space-6: 24px; --az-space-8: 32px; --az-space-10: 40px; --az-space-12: 48px; --az-space-16: 64px;
      --az-radius-sm: 4px; --az-radius-base: 6px; --az-radius-lg: 12px; --az-radius-xl: 18px; --az-radius-xl2: 24px; --az-radius-full: 9999px;
      --az-page-padding-x: 16px; --az-card-padding: 12px; --az-card-gap: 12px; --az-card-radius: 18px;
      --az-hero-radius: 24px; --az-hero-padding: 20px; --az-tile-radius: 12px;
      --az-button-height: 60px; --az-button-radius: 9999px; --az-tap-min: 48px; --az-tap-gameday: 60px;

      --az-shadow-raised: 0 1px 3px rgba(27, 32, 39, 0.10);
      --az-shadow-overlay: 0 4px 10px rgba(27, 32, 39, 0.16);
      --az-shadow-sheet: 0 -2px 18px rgba(27, 32, 39, 0.22);
    }
    [data-theme="outdoor"] {
      --az-border: #10141A; --az-hairline: #10141A;
      --az-text-primary: #10141A; --az-text-secondary: #1F262E; --az-text-accent: #8F3418;
      --az-action: #8F3418; --az-selected: #10141A; --az-on-selected: #F7F3E8;
      --az-attention: #FFD400; --az-on-attention: #10141A;
      --az-hero: #10141A; --az-on-hero: #F7F3E8; --az-hero-tile: #1F262E;
      --az-section-bar: #8F3418; --az-on-target: #005D37; --az-urgent: #A80105; --az-on-tray: #F7F3E8;
    }
    [data-theme="dark"] {
      --az-canvas: #1B2027; --az-surface: #242A33; --az-border: #838B96; --az-hairline: #2F3742;
      --az-text-primary: #F7F3E8; --az-text-secondary: #A8B2BD; --az-text-muted: #838B96; --az-text-accent: #E28A61;
      --az-action: #E28A61; --az-on-action: #1B2027;
      --az-selected: #F7F3E8; --az-on-selected: #1B2027;
      --az-attention: #F5C64B; --az-on-attention: #242A33;
      --az-hero: #2F3742; --az-on-hero: #F7F3E8; --az-hero-tile: #242A33;
      --az-section-bar: #A63F1E; --az-on-section-bar: #F7F3E8;
      --az-on-target: #01D780; --az-urgent: #FE6064;
      --az-tray: #0B8DFF; --az-on-tray: #10141A; --az-pitch-line: #E8F0E4; --az-pitch-edge: #E8F0E4;
    }

    /* Roles the token file does not name. Each comes from the documented palette or type table and is defined once. */
    :root {
      --az-fill-subtle: #EDE6D6;                 /* Paper 200: date chips, tracks, segmented wells */
      --az-on-status: var(--az-on-attention);    /* dark ink carried by the bright status fills */
      --az-practice-text: #0A72D0;               /* Blue kit: blue as icon colour on cream */
      --az-jersey: #0A72D0; --az-on-jersey: #FCFAF3;   /* Blue kit day jersey */
      --az-on-pitch-accent: #FFB894;             /* Accent on grass */
      --az-knob: #FCFAF3;
      --az-jersey-line: var(--az-on-pitch);
      --az-clock: var(--az-on-hero);
      --az-hero-action: var(--az-action); --az-on-hero-action: var(--az-on-action);

      --az-fs-eyebrow: 12px; --az-lh-eyebrow: 16px; --az-track-eyebrow: 1.68px;
      --az-fs-label: 15px; --az-lh-label: 21px;
      --az-fs-body-sm: 16px; --az-lh-body-sm: 24px;
      --az-fs-body: 18px; --az-lh-body: 28px;
      --az-fs-on-grass: 14px; --az-lh-on-grass: 20px;
      --az-fs-title: 22px; --az-lh-title: 28px; --az-track-title: -0.26px;
      --az-fs-display-md: 33px; --az-lh-display-md: 38px; --az-track-display-md: -0.73px;
      --az-fs-display-lg: 40px; --az-lh-display-lg: 46px; --az-track-display-lg: -0.95px;
      --az-fs-clock: 48px; --az-lh-clock: 50px; --az-track-clock: -1.34px;
      --az-w-body: 400; --az-w-strong: 600; --az-w-label: 600; --az-w-eyebrow: 700;
      --az-w-title: 600; --az-w-display-md: 500; --az-w-display-lg: 600; --az-w-clock: 700;
      --az-tap: var(--az-tap-min);

      --az-t-small: 180ms; --az-t-enter: 300ms; --az-t-exit: 200ms;
      --az-ease-out: cubic-bezier(.2,.7,.3,1); --az-ease-in: cubic-bezier(.5,0,.9,.4);

      --phone-screen-bg: var(--az-canvas);
      --phone-system-fg: var(--az-text-primary);
    }
    [data-theme="outdoor"] {
      /* Sun weights from the type table. Newsreader 800 is not among the supplied files, so the clock stays at 700. */
      --az-w-body: 600; --az-w-strong: 700; --az-w-label: 800; --az-w-eyebrow: 800;
      --az-w-title: 700; --az-w-display-md: 700; --az-w-display-lg: 700;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --az-fill-subtle: #2F3742;                 /* Slate 700 */
      --az-practice-text: #2E9BFF;
      --az-jersey: #0B8DFF; --az-on-jersey: #10141A;   /* Blue (night) jersey */
      --az-knob: #1B2027;
      --phone-stage-bg: #10141A;
    }
    /* Game day (live match): larger body, 60px targets. */
    :root.is-gameday {
      --az-fs-body: 20px; --az-lh-body: 30px;
      --az-fs-body-sm: 14px; --az-lh-body-sm: 21px;
      --az-fs-label: 14px; --az-lh-label: 20px;
      --az-tap: var(--az-tap-gameday);
    }

    [hidden] { display: none !important; }
    .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    :root[data-theme="dark"] body { background: var(--phone-stage-bg); }
    /* Embedded presentation (board.html, compare.html): no stage, handset at full size. */
    :root.is-embed body, :root.is-embed[data-theme] body { padding: 0; background: transparent; }
    :root.is-embed .phone-frame { zoom: 1; }

    /* The app owns its own bars: the tab bar reserves the bottom safe area. */
    .phone-content { padding-bottom: 0; overflow: hidden; }

    .app, .sheet-layer, .toast {
      font-family: var(--az-font-ui);
      font-size: var(--az-fs-body);
      line-height: var(--az-lh-body);
      font-weight: var(--az-w-body);
      color: var(--az-text-primary);
      font-variant-numeric: lining-nums tabular-nums;
      -webkit-font-smoothing: antialiased;
    }
    .app { display: grid; grid-template-rows: minmax(0, 1fr) auto; height: 100%; background: var(--az-canvas); }
    .app h1, .app h2, .app h3, .app p, .app ul { margin: 0; }
    .app ul { padding: 0; list-style: none; }
    .app button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
    .app button:disabled, .sheet button:disabled { cursor: not-allowed; opacity: .4; }
    .app a { color: inherit; text-decoration: none; }
    .app strong, .sheet strong { font-weight: 700; }
    .app :focus-visible, .sheet :focus-visible { outline: 3px solid var(--az-text-primary); outline-offset: 2px; }
    .on-hero :focus-visible, .on-navy :focus-visible, .toast :focus-visible { outline: 3px solid var(--az-on-hero); outline-offset: 2px; }
    .pitch :focus-visible { outline: 3px solid var(--az-on-pitch); outline-offset: 2px; }
    .app h2:focus, .sheet h2:focus { outline: none; }

    .screens { min-height: 0; }
    .screen { height: 100%; }
    .screen-bar { padding: var(--az-space-2) var(--az-page-padding-x) var(--az-space-3); display: grid; gap: var(--az-space-3); }
    .screen-bar h1 { font-family: var(--az-font-display); font-size: var(--az-fs-display-md); line-height: var(--az-lh-display-md); font-weight: var(--az-w-display-md); letter-spacing: var(--az-track-display-md); }
    .screen-kicker, .eyebrow { font-size: var(--az-fs-eyebrow); line-height: var(--az-lh-eyebrow); font-weight: var(--az-w-eyebrow); letter-spacing: var(--az-track-eyebrow); text-transform: uppercase; color: var(--az-text-secondary); }
    .screen-body { display: flex; flex-direction: column; gap: var(--az-space-6); padding-block: var(--az-space-1) var(--az-space-6); scrollbar-width: none; }
    .screen-body::-webkit-scrollbar { display: none; }
    .screen-body > * { flex: none; }
    .screen-body > :not(.od-rail) { margin-inline: var(--az-page-padding-x); }
    .screen.is-entering .screen-body { animation: screen-in 200ms var(--az-ease-out); }
    @keyframes screen-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .section { display: grid; gap: var(--az-space-3); }
    .section-head h2, .section > h2, .fair h2, .empty h2, .empty h3, .day-head {
      font-family: var(--az-font-display); font-size: var(--az-fs-title); line-height: var(--az-lh-title); font-weight: var(--az-w-title); letter-spacing: var(--az-track-title);
    }
    .app .section-bar {
      display: block; padding: var(--az-space-2) var(--az-space-3); border-radius: var(--az-radius-lg);
      background: var(--az-section-bar); color: var(--az-on-section-bar);
      font-family: var(--az-font-ui); font-size: var(--az-fs-label); line-height: var(--az-lh-label); font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    }
    .muted { color: var(--az-text-muted); }
    .small { font-size: var(--az-fs-body-sm); line-height: var(--az-lh-body-sm); }

    .icon { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .icon-sm { width: 20px; height: 20px; }

    .card { background: var(--az-surface); border: 1px solid var(--az-hairline); border-radius: var(--az-card-radius); padding: var(--az-card-padding); }

    /* Buttons: capsules, uppercase label role, pressed at 60% opacity */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--az-space-2);
      min-height: var(--az-button-height); border-radius: var(--az-button-radius);
      font-size: var(--az-fs-label); line-height: var(--az-lh-label); font-weight: var(--az-w-label); text-transform: uppercase; white-space: nowrap;
      transition: opacity var(--az-t-small) var(--az-ease-out);
    }
    .app .btn, .sheet .btn { padding: 0 var(--az-space-6); text-align: center; }
    .btn:active { opacity: .6; }
    .btn-primary, .app .btn-primary, .sheet .btn-primary { background: var(--az-action); color: var(--az-on-action); }
    .btn-secondary, .app .btn-secondary, .sheet .btn-secondary { background: transparent; color: var(--az-text-primary); border: 1.5px solid var(--az-border); }
    .btn-navy-raised, .app .btn-navy-raised { background: var(--az-hero-tile); color: var(--az-on-hero); border: 1.5px solid var(--az-on-hero-muted); }
    .btn-danger, .sheet .btn-danger { background: transparent; color: var(--az-urgent); border: 1.5px solid var(--az-urgent); }
    .btn-danger-solid, .sheet .btn-danger-solid { background: var(--az-status-out); color: var(--az-on-danger); }
    .btn-block { display: flex; width: 100%; }
    .app .btn-sm, .sheet .btn-sm { min-height: var(--az-tap); padding: 0 var(--az-space-4); }
    .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: var(--az-tap); height: var(--az-tap); border-radius: var(--az-radius-full); color: var(--az-text-primary); }
    .app .icon-btn.is-outlined, .sheet .icon-btn.is-outlined { border: 1.5px solid var(--az-border); background: transparent; }
    .link { display: inline-flex; align-items: center; min-height: var(--az-tap); font-size: var(--az-fs-label); line-height: var(--az-lh-label); font-weight: var(--az-w-label); }
    .app a.link { color: var(--az-text-accent); text-decoration: underline; text-underline-offset: 3px; }

    /* Team switcher tiles and filter pills: selected is slate, never orange */
    .team-chip { min-height: 60px; border-radius: var(--az-radius-lg); align-content: center; --od-gap: 0px; }
    .app .team-chip { padding: var(--az-space-2) var(--az-space-4); background: var(--az-surface); border: 1.5px solid var(--az-hairline); }
    .team-chip-name { font-size: var(--az-fs-body-sm); line-height: var(--az-lh-body-sm); font-weight: var(--az-w-strong); white-space: nowrap; }
    .team-chip-meta { font-size: var(--az-fs-label); line-height: var(--az-lh-label); color: var(--az-text-muted); white-space: nowrap; }
    .app .team-chip[aria-pressed="true"], .app .chip[aria-pressed="true"], .app .day[aria-pressed="true"] { background: var(--az-selected); border-color: var(--az-selected); color: var(--az-on-selected); }
    .team-chip[aria-pressed="true"] .team-chip-meta, .day[aria-pressed="true"] .day-wd, .day[aria-pressed="true"] .day-marks span { color: var(--az-on-selected); }

    .chip { display: inline-flex; align-items: center; min-height: var(--az-tap); border-radius: var(--az-radius-full); font-size: var(--az-fs-label); line-height: var(--az-lh-label); font-weight: var(--az-w-label); white-space: nowrap; }
    .app .chip { padding: 0 var(--az-space-4); background: transparent; border: 1.5px solid var(--az-border); }

    .seg { display: flex; gap: var(--az-space-1); padding: var(--az-space-1); border-radius: var(--az-radius-lg); background: var(--az-fill-subtle); }
    .app .seg button { flex: 1 1 0; min-height: var(--az-tap); padding: 0 var(--az-space-3); border-radius: var(--az-space-2); font-size: var(--az-fs-label); line-height: var(--az-lh-label); font-weight: var(--az-w-label); color: var(--az-text-secondary); text-align: center; white-space: nowrap; }
    .app .seg button[aria-pressed="true"] { background: var(--az-selected); color: var(--az-on-selected); }
    .seg-compact { flex: none; }

    /* Hero band: slate block, cream text, stat tiles */
    .hero { display: grid; gap: var(--az-space-3); padding: var(--az-hero-padding); border-radius: var(--az-hero-radius); background: var(--az-hero); color: var(--az-on-hero); }
    .hero-label { --od-gap: 8px; font-size: var(--az-fs-eyebrow); line-height: var(--az-lh-eyebrow); font-weight: var(--az-w-eyebrow); letter-spacing: var(--az-track-eyebrow); text-transform: uppercase; color: var(--az-hero-accent); }
    .hero-title { font-family: var(--az-font-display); font-size: var(--az-fs-title); line-height: var(--az-lh-title); font-weight: var(--az-w-title); letter-spacing: var(--az-track-title); }
    .hero-line { font-size: var(--az-fs-body); line-height: var(--az-lh-body); font-weight: var(--az-w-strong); }
    .hero-meta { font-size: var(--az-fs-body-sm); line-height: var(--az-lh-body-sm); color: var(--az-on-hero-muted); }
    .live-pill { display: inline-flex; align-items: center; gap: var(--az-space-2); font-size: var(--az-fs-eyebrow); line-height: var(--az-lh-eyebrow); font-weight: var(--az-w-eyebrow); letter-spacing: var(--az-track-eyebrow); text-transform: uppercase; color: var(--az-hero-accent); }
    .live-dot { display: block; flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--az-status-out); }
    .is-running .live-dot { animation: pulse 1600ms ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }

    /* Week strip */
    .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--az-space-1); }
    .day { min-height: 84px; border-radius: var(--az-radius-lg); justify-items: center; align-content: center; --od-gap: 0px; }
    .app .day { background: var(--az-surface); border: 1px solid var(--az-hairline); text-align: center; padding: var(--az-space-2) 0; }
    .day-wd { font-size: var(--az-fs-eyebrow); line-height: var(--az-lh-eyebrow); font-weight: var(--az-w-eyebrow); text-transform: uppercase; color: var(--az-text-muted); }
    .day-num { font-family: var(--az-font-display); font-size: var(--az-fs-title); line-height: var(--az-lh-title); font-weight: var(--az-w-title); }
    .day-marks { display: flex; justify-content: center; align-items: center; min-height: 20px; }
    .day-marks .is-match { color: var(--az-on-target); }
    .day-marks .is-practice { color: var(--az-practice-text); }
    .app .day.is-today { border: 2px solid var(--az-text-accent); }
    .week-nav-label { font-size: var(--az-fs-body-sm); line-height: var(--az-lh-body-sm); font-weight: var(--az-w-strong); text-align: center; }

    /* Event cards: date chip, bright badge with the kind in words */
    .event-list { display: grid; gap: var(--az-card-gap); }
    .event-row { width: 100%; --od-gap: 12px; border-radius: var(--az-card-radius); min-height: 76px; }
    .app .event-row { background: var(--az-surface); border: 1px solid var(--az-hairline); padding: var(--az-card-padding); }
    .datecell { width: 52px; padding: var(--az-space-2) 0; border-radius: var(--az-radius-lg); background: var(--az-fill-subtle); text-align: center; --od-gap: 0px; }
    .dc-mo { font-size: var(--az-fs-eyebrow); line-height: var(--az-lh-eyebrow); font-weight: var(--az-w-eyebrow); letter-spacing: var(--az-track-eyebrow); text-transform: uppercase; color: var(--az-text-secondary); }
    .dc-d { font-family: var(--az-font-display); font-size: var(--az-fs-title); line-height: var(--az-lh-title); font-weight: var(--az-w-title); }
    .ev-tag { display: flex; align-items: center; gap: var(--az-space-2); font-size: var(--az-fs-eyebrow); line-height: var(--az-lh-eyebrow); font-weight: var(--az-w-eyebrow); letter-spacing: var(--az-track-eyebrow); text-transform: uppercase; color: var(--az-text-secondary); }
    .od-field > .ev-tag, .hero > .ev-tag, .card > .ev-tag, .sheet > .ev-tag { display: flex; }
    .ev-badge { display: grid; place-items: center; flex: none; width: 28px; height: 28px; border-radius: var(--az-radius-base); background: var(--az-event-match); color: var(--az-on-status); }
    .ev-badge .icon { width: 20px; height: 20px; }
    .ev-badge.is-practice { background: var(--az-event-practice); }
    .ev-badge.is-live { background: var(--az-status-out); color: var(--az-on-danger); }
    .ev-title { font-weight: var(--az-w-strong); }
    .ev-meta { font-size: var(--az-fs-body-sm); line-height: var(--az-lh-body-sm); color: var(--az-text-secondary); }
    .chev { color: var(--az-text-muted); }
    .day-head-today { font-size: var(--az-fs-eyebrow); line-height: var(--az-lh-eyebrow); font-weight: var(--az-w-eyebrow); letter-spacing: var(--az-track-eyebrow); text-transform: uppercase; color: var(--az-text-accent); }

    /* Empty state */
    .empty { display: grid; gap: var(--az-space-3); justify-items: start; padding: var(--az-space-5) var(--az-space-4); border-radius: var(--az-card-radius); background: var(--az-surface); border: 1.5px dashed var(--az-border); }
    .empty-actions { --od-gap: 8px; }

    /* Stat tiles */
    .stat { padding: var(--az-space-3); border-radius: var(--az-tile-radius); background: var(--az-surface); border: 1px solid var(--az-hairline); --od-gap: 0px; }
    .stat-num { font-family: var(--az-font-display); font-size: var(--az-fs-title); line-height: var(--az-lh-title); font-weight: var(--az-w-title); letter-spacing: var(--az-track-title); white-space: nowrap; }
    .stat-cap { font-size: var(--az-fs-eyebrow); line-height: var(--az-lh-eyebrow); font-weight: var(--az-w-eyebrow); letter-spacing: var(--az-track-eyebrow); text-transform: uppercase; color: var(--az-text-muted); }

    /* Gameday: the scoreboard is the hero band */
    .scorebar { margin: 0 var(--az-page-padding-x) var(--az-space-3); padding: var(--az-space-4) var(--az-hero-padding) var(--az-hero-padding); border-radius: var(--az-hero-radius); background: var(--az-hero); color: var(--az-on-hero); display: grid; gap: var(--az-space-3); }
    .sb-meta { font-size: var(--az-fs-eyebrow); line-height: var(--az-lh-eyebrow); font-weight: var(--az-w-eyebrow); text-transform: uppercase; color: var(--az-on-hero-muted); }
    .sb-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: var(--az-space-3); align-items: start; }
    .sb-team { --od-gap: 4px; justify-items: start; }
    .sb-team.is-right { justify-items: end; text-align: right; }
    .sb-name { font-size: var(--az-fs-body-sm); line-height: var(--az-lh-body-sm); font-weight: var(--az-w-strong); min-height: calc(2 * var(--az-lh-body-sm)); }
    .sb-score { font-family: var(--az-font-display); font-size: var(--az-fs-display-lg); line-height: var(--az-lh-display-lg); font-weight: var(--az-w-display-lg); letter-spacing: var(--az-track-display-lg); }
    .sb-clock { display: grid; gap: var(--az-space-1); justify-items: center; }
    .clock { display: block; min-width: 5ch; text-align: center; font-family: var(--az-font-display); font-size: var(--az-fs-clock); line-height: var(--az-lh-clock); font-weight: var(--az-w-clock); letter-spacing: var(--az-track-clock); white-space: nowrap; color: var(--az-clock); }
    .clock-btn { display: grid; place-items: center; width: var(--az-tap); height: var(--az-tap); border-radius: 50%; }
    .app .clock-btn { background: var(--az-on-hero); color: var(--az-hero); }
    .clock-state { display: block; font-size: var(--az-fs-eyebrow); line-height: var(--az-lh-eyebrow); font-weight: var(--az-w-eyebrow); text-transform: uppercase; color: var(--az-on-hero-muted); white-space: nowrap; }
    .app .goal-btn { display: flex; width: 100%; min-height: var(--az-tap); padding: 0 var(--az-space-2); gap: var(--az-space-1); }

    .fair { display: grid; gap: var(--az-space-3); }
    .suggest { --od-gap: 12px; padding: var(--az-space-3); border-radius: var(--az-radius-lg); background: var(--az-fill-subtle); }
    .suggest-label { font-size: var(--az-fs-eyebrow); line-height: var(--az-lh-eyebrow); font-weight: var(--az-w-eyebrow); letter-spacing: var(--az-track-eyebrow); text-transform: uppercase; color: var(--az-text-accent); }
    .suggest-text { font-weight: var(--az-w-strong); }
    .balanced { display: flex; align-items: center; gap: var(--az-space-2); color: var(--az-on-target); font-weight: var(--az-w-strong); font-size: var(--az-fs-body-sm); line-height: var(--az-lh-body-sm); }

    /* The pitch: mown grass in two stripe bands, near-white markings, dark outer frame. Same in every theme. */
    .pitch { position: relative; display: grid; border: 4px solid var(--az-pitch-edge); border-radius: var(--az-radius-xl); background: var(--az-pitch-turf); color: var(--az-on-pitch); }
    .pitch-row { display: flex; justify-content: space-around; padding: var(--az-space-3) var(--az-space-2); background: var(--az-pitch-turf); }
    .pitch-row:nth-of-type(odd) { background: var(--az-pitch-turf-alt); }
    .pitch-row:first-of-type { border-radius: 14px 14px 0 0; }
    .pitch-row:last-of-type { border-radius: 0 0 14px 14px; }
    .pitch-lines { position: absolute; inset: 8px; border: 2px solid var(--az-pitch-line); border-radius: var(--az-radius-base); pointer-events: none; }
    .pitch-arc { position: absolute; top: 8px; left: 50%; width: 96px; height: 48px; transform: translateX(-50%); border: 2px solid var(--az-pitch-line); border-top: 0; border-radius: 0 0 48px 48px; pointer-events: none; }
    .pitch-box { position: absolute; bottom: 8px; left: 50%; width: 56%; height: 96px; transform: translateX(-50%); border: 2px solid var(--az-pitch-line); border-bottom: 0; pointer-events: none; }
    .token, .slot { position: relative; z-index: 1; width: 96px; min-height: var(--az-tap); border-radius: var(--az-radius-lg); justify-items: center; --od-gap: 0px; transition: transform var(--az-t-small) var(--az-ease-out); }
    .app .token, .app .slot { padding: var(--az-space-1); color: var(--az-on-pitch); text-align: center; }
    .jersey-chip { display: grid; place-items: center; width: 52px; height: 52px; }
    .jersey-shape { grid-area: 1 / 1; display: block; width: 100%; height: 100%; fill: var(--az-jersey); stroke: var(--az-jersey-line); stroke-width: 2; stroke-linejoin: round; }
    .jersey-no { grid-area: 1 / 1; display: grid; place-items: center; padding-top: var(--az-space-1); color: var(--az-on-jersey); font-size: var(--az-fs-body); line-height: 1; font-weight: 800; }
    .jersey-chip.is-empty .jersey-shape { fill: transparent; stroke-dasharray: 4 3; }
    .jersey-chip.is-empty .jersey-no { color: var(--az-on-pitch); }
    .token.is-rest .jersey-shape, .slot[aria-pressed="true"] .jersey-shape { stroke: var(--az-on-pitch-accent); stroke-width: 3.5; }
    .slot.is-drop .jersey-shape { stroke-width: 4.5; }
    .slot.is-drop { transform: scale(1.08); }
    .token-name { font-size: var(--az-fs-body-sm); line-height: var(--az-lh-body-sm); font-weight: 700; }
    .token-min { font-size: var(--az-fs-on-grass); line-height: var(--az-lh-on-grass); font-weight: 600; color: var(--az-on-pitch-muted); }

    .player-list { display: grid; gap: var(--az-card-gap); }
    .prow { --od-gap: 12px; padding: var(--az-card-padding); border-radius: var(--az-card-radius); background: var(--az-surface); border: 1px solid var(--az-hairline); }
    .prow-num { width: 32px; font-family: var(--az-font-display); font-size: var(--az-fs-title); line-height: var(--az-lh-title); font-weight: var(--az-w-title); text-align: center; }
    .prow-body { --od-gap: 4px; }
    .prow-name { font-weight: var(--az-w-strong); }
    .prow-pos { font-weight: var(--az-w-body); color: var(--az-text-muted); font-size: var(--az-fs-body-sm); }
    .prow-min { font-size: var(--az-fs-body-sm); line-height: var(--az-lh-body-sm); font-weight: var(--az-w-strong); }
    .bar { display: block; height: 10px; border-radius: var(--az-radius-full); background: var(--az-fill-subtle); border: 1px solid var(--az-border); overflow: hidden; }
    .bar-fill { display: block; height: 100%; background: var(--az-text-primary); transform-origin: left center; transition: transform var(--az-t-enter) var(--az-ease-out); }
    .bar.is-due .bar-fill, .bar.is-rest .bar-fill { background: var(--az-attention); }
    .pstatus { display: flex; align-items: center; gap: var(--az-space-1); font-size: var(--az-fs-label); line-height: var(--az-lh-label); font-weight: var(--az-w-label); color: var(--az-text-secondary); }
    .od-field > .pstatus { display: flex; justify-self: start; }
    .pstatus.is-ok { color: var(--az-on-target); }
    .pstatus.is-out { color: var(--az-urgent); }
    .pstatus.is-due, .pstatus.is-rest, .plan-status.is-off { padding: 2px var(--az-space-2); border-radius: var(--az-radius-base); background: var(--az-attention); color: var(--az-on-attention); }

    /* Practice */
    .next-practice { display: grid; gap: var(--az-space-1); }
    .block-list { display: grid; gap: var(--az-card-gap); }
    .block { --od-gap: 8px; padding: var(--az-space-2) var(--az-space-2) var(--az-space-2) var(--az-card-padding); border-radius: var(--az-card-radius); background: var(--az-surface); border: 1px solid var(--az-hairline); }
    .block-time { width: 60px; --od-gap: 0px; }
    .block-start { font-family: var(--az-font-display); font-size: var(--az-fs-title); line-height: var(--az-lh-title); font-weight: var(--az-w-title); white-space: nowrap; }
    .block-dur { font-size: var(--az-fs-label); line-height: var(--az-lh-label); color: var(--az-text-muted); white-space: nowrap; }
    .block-body { min-height: var(--az-tap); align-content: center; border-radius: var(--az-space-2); --od-gap: 0px; }
    .block-cat { font-size: var(--az-fs-label); line-height: var(--az-lh-label); color: var(--az-text-muted); }
    .summary-line { font-size: var(--az-fs-body-sm); line-height: var(--az-lh-body-sm); font-weight: var(--az-w-strong); color: var(--az-text-secondary); }
    .block-title { font-weight: var(--az-w-strong); line-height: var(--az-lh-body-sm); }
    .plan-status { justify-self: start; font-size: var(--az-fs-label); line-height: var(--az-lh-label); font-weight: var(--az-w-label); }
    .plan-status.is-ok { color: var(--az-on-target); }

    /* Team */
    .roster-row { width: 100%; --od-gap: 12px; border-radius: var(--az-card-radius); min-height: 68px; }
    .app .roster-row { background: var(--az-surface); border: 1px solid var(--az-hairline); padding: var(--az-card-padding); }
    .jersey { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--az-hero); color: var(--az-on-hero); font-size: var(--az-fs-body-sm); line-height: 1; font-weight: 800; }
    .jersey.is-lg { width: 60px; height: 60px; font-family: var(--az-font-display); font-size: var(--az-fs-title); font-weight: var(--az-w-title); }
    .brand-foot { display: grid; gap: var(--az-space-2); justify-items: center; padding: var(--az-space-4) 0 0; text-align: center; }
    .brand-lockup { width: 168px; }
    .brand-lockup.is-reversed { display: none; }
    [data-theme="dark"] .brand-lockup.is-default { display: none; }
    [data-theme="dark"] .brand-lockup.is-reversed { display: block; }

    /* Tab bar: selected is slate with a top marker and a heavier label */
    .tabbar { display: flex; padding: var(--az-space-1) var(--az-space-1) var(--phone-safe-bottom); background: var(--az-surface); border-top: 1px solid var(--az-hairline); }
    .tabbar a { position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 56px; border-radius: var(--az-radius-lg); }
    .app .tabbar a { color: var(--az-text-muted); }
    .tab-icon { position: relative; display: block; height: 24px; }
    .tab-label { font-size: var(--az-fs-label); line-height: var(--az-lh-label); font-weight: var(--az-w-label); }
    .app .tabbar a[aria-current="page"] { color: var(--az-text-primary); }

    :root[data-palette="blend"][data-accent="blue"] { --az-action: #3AA0FF; --az-hero-accent: #3AA0FF; --az-hero-action: #3AA0FF; --az-clock: #3AA0FF; }

    /* Hero options for G (blend), chosen with ?hero=; navy is the default. Neutral ink replaces navy in buttons, bars and dark-mode grounds. */
    /* G with pitch green: every app green (match badges, starting status, on-track text, fair-minutes bar, switches) uses the button green #2FD175.
       Light-mode text uses #1A7541, the same hue darkened to pass contrast on white. The lineup pitch turf is left as is. */
    :root[data-palette="blend"][data-accent="green"] {
      --az-event-match: #2FD175; --az-status-start: #2FD175; --az-ok-fill: #2FD175; --az-on-target: #1A7541;
    }
    :root[data-palette="blend"][data-accent="green"][data-theme="dark"] { --az-on-target: #2FD175; }
    :root[data-palette="blend"][data-hero="charcoal"] {
      --az-hero: #1E2124; --az-hero-tile: #2A2E33; --az-on-hero-muted: #B4B8BE; --az-section-bar: #1E2124; --az-tray: #1E2124;
      --az-text-accent: #2A2E33; --az-on-action: #141414; --az-action-edge: #141414; --az-on-hero-action: #141414;
    }
    :root[data-palette="blend"][data-hero="black"] {
      --az-hero: #0B0B0C; --az-hero-tile: #1C1C1E; --az-on-hero-muted: #B4B4B8; --az-section-bar: #0B0B0C; --az-tray: #0B0B0C;
      --az-text-accent: #1C1C1E; --az-on-action: #0B0B0C; --az-action-edge: #0B0B0C; --az-on-hero-action: #0B0B0C;
    }
    :root[data-palette="blend"][data-hero="charcoal"][data-theme="dark"] {
      --az-canvas: #0F1012; --az-surface: #1A1C1F; --az-hairline: #2C2F33; --az-fill-subtle: #2C2F33; --az-border: #858A92;
      --az-text-secondary: #B4B8BE; --az-text-muted: #8C9097; --az-text-accent: var(--az-action);
      --az-hero: #26292D; --az-hero-tile: #1A1C1F; --az-section-bar: #33373C; --az-tray: #26292D; --az-on-action: #141414;
    }
    :root[data-palette="blend"][data-hero="black"][data-theme="dark"] {
      --az-canvas: #000000; --az-surface: #141416; --az-hairline: #26262A; --az-fill-subtle: #26262A; --az-border: #85858C;
      --az-text-secondary: #B4B4B8; --az-text-muted: #8C8C92; --az-text-accent: var(--az-action);
      --az-hero: #141416; --az-hero-tile: #000000; --az-section-bar: #2A2A2E; --az-tray: #141416; --az-on-action: #0B0B0C;
      --az-on-selected: #000000; --az-on-jersey: #000000;
    }

    /* G high contrast (Appearance > High contrast, or ?theme=contrast): white ground, pure black ink and hairlines, the same pitch green with a black edge. */
    :root[data-palette="blend"][data-theme="outdoor"],
    :root[data-palette="blend"][data-hero][data-accent][data-theme="outdoor"] {
      --az-canvas: #FFFFFF; --az-surface: #FFFFFF; --az-hairline: #0B0B0C; --az-border: #0B0B0C; --az-fill-subtle: #E6E9EF;
      --az-text-primary: #000000; --az-text-secondary: #1C1C1E; --az-text-muted: #3A3A3E; --az-text-accent: #000000;
      --az-on-action: #000000; --az-action-edge: #000000; --az-selected: #000000; --az-on-selected: #FFFFFF;
      --az-attention: #FFD400; --az-on-attention: #000000;
      --az-hero: #000000; --az-on-hero: #FFFFFF; --az-on-hero-muted: #D4D4D8; --az-hero-tile: #1C1C1E; --az-on-hero-action: #000000;
      --az-section-bar: #000000; --az-on-section-bar: #FFFFFF; --az-tray: #000000; --az-on-tray: #FFFFFF;
      --az-on-target: #0E5A30; --az-urgent: #A80105; --az-jersey: #0A72D0; --az-on-jersey: #FFFFFF;
    }

    /* PDF layout: hero stat tiles and the Fair minutes bar */
    .hero-tiles { --od-gap: 8px; }
    .hero-tile { padding: var(--az-space-2); border-radius: var(--az-tile-radius); background: var(--az-hero-tile); --od-gap: 0px; }
    .hero-tile-num { font-family: var(--az-font-display); font-size: var(--az-fs-title); line-height: var(--az-lh-title); font-weight: var(--az-w-title); letter-spacing: var(--az-track-title); }
    .hero-tile-unit { font-family: var(--az-font-ui); font-size: var(--az-fs-eyebrow); font-weight: var(--az-w-eyebrow); letter-spacing: 0; }
    .hero-tile-cap { font-size: var(--az-fs-eyebrow); line-height: var(--az-lh-eyebrow); font-weight: var(--az-w-eyebrow); letter-spacing: var(--az-track-eyebrow); text-transform: uppercase; color: var(--az-on-hero-muted); }
    .fair-bar { display: flex; gap: var(--az-space-1); }
    .fair-seg { display: block; flex: 1 1 0; height: 8px; border-radius: var(--az-radius-full); background: var(--az-ok-fill, var(--az-on-target)); }
    .fair-seg.is-due { background: var(--az-attention); box-shadow: inset 0 0 0 1px rgba(0,0,0,.28); }
    .fair-need { color: var(--az-text-accent); font-weight: 700; }
    .section-eyebrow { display: flex; align-items: center; gap: var(--az-space-1); font-size: var(--az-fs-eyebrow); line-height: var(--az-lh-eyebrow); font-weight: var(--az-w-eyebrow); letter-spacing: var(--az-track-eyebrow); text-transform: uppercase; color: var(--az-text-secondary); }
    .section-eyebrow.is-need { color: var(--az-text-accent); }

    /* Home: team switcher, hero and week fit in one screen without scrolling */
    #bar-home { padding-bottom: var(--az-space-2); }
    #body-home { gap: var(--az-space-4); }
    #body-home .hero { gap: var(--az-space-2); }
    #body-home .section { gap: var(--az-space-2); }
    #body-home .day { min-height: 76px; }

    @media (hover: hover) {
      .btn:hover { opacity: .88; }
      .app .event-row:hover, .app .roster-row:hover, .app .team-chip:not([aria-pressed="true"]):hover, .app .day:not([aria-pressed="true"]):hover { border-color: var(--az-border); }
      .app .tabbar a:not([aria-current="page"]):hover { color: var(--az-text-primary); }
      .sheet .pick:hover .ev-title, .block-body:hover .block-title { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>

    'use strict';

    /* ---------- helpers ---------- */
    const $ = (s, r) => (r || document).querySelector(s);
    const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const icon = (n, cls) => '<svg class="icon ' + (cls || '') + '" aria-hidden="true" focusable="false"><use href="#i-' + n + '"/></svg>';
    const badge = kind => '<span class="ev-badge is-' + kind + '">' + icon(kind === 'practice' ? 'clipboard' : 'ball') + '</span>';

    const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);

    const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const WDL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const toDate = iso => { const p = iso.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
    const pad = n => String(n).padStart(2, '0');
    const toISO = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    const addDays = (iso, n) => { const d = toDate(iso); d.setDate(d.getDate() + n); return toISO(d); };
    const weekStart = iso => addDays(iso, -((toDate(iso).getDay() + 6) % 7));
    const fmtDay = iso => { const d = toDate(iso); return WD[d.getDay()] + ', ' + MO[d.getMonth()] + ' ' + d.getDate(); };
    const fmtShort = iso => { const d = toDate(iso); return MO[d.getMonth()] + ' ' + d.getDate(); };
    const fmtTime = t => { if (!t) return ''; const p = t.split(':').map(Number); const ap = p[0] >= 12 ? 'PM' : 'AM'; return (p[0] % 12 || 12) + ':' + pad(p[1]) + ' ' + ap; };
    const addMin = (t, m) => { const p = t.split(':').map(Number); const total = p[0] * 60 + p[1] + m; return pad(Math.floor(total / 60) % 24) + ':' + pad(total % 60); };

    /* ---------- appearance ---------- */
    const mqDark = window.matchMedia('(prefers-color-scheme: dark)');

    const okTheme = v => (['system', 'light', 'dark', 'contrast'].indexOf(v) >= 0 ? v : null);
    let themePref = okTheme(new URLSearchParams(location.search).get('theme')) || okTheme(themeStore.get()) || 'system';
    let gamedayLive = false;
    // Design-system themes: dark at night, outdoor on the live match, indoor everywhere else.
    function applyTheme() {
      const root = document.documentElement;
      const dark = themePref === 'system' ? mqDark.matches : themePref === 'dark';
      const pal = root.dataset.palette;
      const outdoorOk = !pal || pal === 'cream';
      // High contrast is the outdoor theme chosen by hand; it holds on every screen, not just the live match.
      root.dataset.theme = themePref === 'contrast' ? 'outdoor' : dark ? 'dark' : (gamedayLive && outdoorOk ? 'outdoor' : 'indoor');
      root.classList.toggle('is-gameday', gamedayLive);

    /* ---------- demo data (teams, venues, opponents from the coach's own schedule) ---------- */

    const teamById = id => TEAMS.find(t => t.id === id);

    const firstName = p => p.name.split(' ')[0];

    const matchOver = () => state.gd.phase === 'ft';
    const matchLive = () => ['live1', 'ht', 'live2'].indexOf(state.gd.phase) >= 0;
    const isLive = e => !!e.today && matchLive();
    const isPre = e => !!e.today && state.gd.phase === 'pre';
    const filledCount = () => state.gd.slots.filter(x => x.pid).length;
    const slotIndexOf = id => state.gd.slots.findIndex(x => x.pid === id);
    const num = p => (p.n == null ? '–' : p.n);
    const pitchRows = () => ['FWD', 'MID', 'DEF', 'GK'].map(pos => state.gd.slots.map((x, i) => (x.pos === pos ? i : -1)).filter(i => i >= 0)).filter(r => r.length);
    const isPast = e => e.date < TODAY || (!!e.today && matchOver());
    const evSort = (a, b) => (a.date + a.time).localeCompare(b.date + b.time);
    const evTitle = e => e.type === 'match' ? 'vs ' + e.opp + (e.oppFrom ? ' (' + e.oppFrom + ')' : '') : 'Practice';
    const evScore = e => e.today ? [state.gd.us, state.gd.them] : e.score;
    const resultText = s => (s[0] > s[1] ? 'W' : s[0] < s[1] ? 'L' : 'D') + ' ' + s[0] + '–' + s[1];
    const phaseLabel = () => ({ pre: 'Pre-match', live1: '1st half', ht: 'Half time', live2: '2nd half', ft: 'Full time' }[state.gd.phase]);
    const clockState = () => state.gd.phase === 'ft' ? 'Final' : state.gd.phase === 'ht' ? 'Start 2nd half' : state.gd.running ? 'Running' : 'Paused';

    /* ---------- fair play ---------- */
    function fair() {
      const g = state.gd;
      const avail = ROSTERS.stars.filter(p => !p.out);
      const n = Math.max(avail.length, 1);
      const target = (HALF * 2 * ON_FIELD) / n;
      const now = (g.sec * ON_FIELD) / n;
      const slotOf = id => g.slots.find(s => s.pid === id);
      const status = p => {
        if (p.out) return 'out';
        const slot = slotOf(p.id);
        const d = p.sec - now;
        if (slot) return slot.pos === 'GK' ? 'gk' : d > 420 ? 'rest' : 'ok';
        return d < -300 ? 'due' : 'ok';
      };
      const due = avail.filter(p => status(p) === 'due');
      const rest = avail.filter(p => status(p) === 'rest');
      let suggestion = null;
      if (!matchOver()) {
        const benchP = g.bench.map(starById).filter(Boolean).sort((a, b) => a.sec - b.sec)[0];
        const fieldIdx = g.slots.map((s, i) => ({ i: i, pos: s.pos, p: starById(s.pid) })).filter(x => x.pos !== 'GK').sort((a, b) => b.p.sec - a.p.sec)[0];
        if (benchP && fieldIdx && fieldIdx.p.sec - benchP.sec > 300) suggestion = { inId: benchP.id, slot: fieldIdx.i };
      }
      return { target: target, status: status, due: due, rest: rest, n: n, suggestion: suggestion, slotOf: slotOf };
    }
    const STATUS = {
      due: { cls: 'is-due', icon: 'alert', text: 'Due on' },
      rest: { cls: 'is-rest', icon: 'alert', text: 'Due a rest' },
      ok: { cls: 'is-ok', icon: 'check', text: 'On track' },
      gk: { cls: '', icon: 'check', text: 'Keeper' },
      out: { cls: 'is-out', icon: 'ban', text: 'Out' }
    };
    const statusLine = st => '<span class="pstatus ' + STATUS[st].cls + '">' + icon(STATUS[st].icon, 'icon-sm') + STATUS[st].text + '</span>';

    /* ---------- shared fragments ---------- */

      return '<div class="od-rail" role="group" aria-label="Choose team">' + TEAMS.map(t =>

        '</button>').join('') + '</div>';

    function eventRow(e, o) {
      o = o || {};

      if (live) meta = phaseLabel() + ' · ' + state.gd.us + '–' + state.gd.them + ' · ' + e.venue;

      else if (past) meta = 'Done · ' + fmtTime(e.time);
      else meta = fmtTime(e.time) + ' · ' + (e.venue || 'Location not set');

        icon('chev-right', 'chev') + '</button></li>';
    }

    function weekStrip(week, o) {
      let html = '<div class="week" role="group" aria-label="Days of the week">';
      for (let i = 0; i < 7; i++) {
        const iso = addDays(week, i);
        const d = toDate(iso);
        const evs = EVENTS.filter(e => e.date === iso && (o.team === 'all' || e.team === o.team) && (!o.type || o.type === 'all' || e.type === o.type));
        const types = ['match', 'practice'].filter(t => evs.some(e => e.type === t));

    /* ---------- Calendar ---------- */
    function renderCalendar() {

      $('#bar-calendar').innerHTML =
